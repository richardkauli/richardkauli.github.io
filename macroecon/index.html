<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Classroom Economy Game</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{
      --fg:#ffffff;
      --green:#22c55e;
      --bg:#000000;
      --greenDim: rgba(34,197,94,.12);
      --text-scale:1.3;
    }
    html, body { height:100%; background:var(--bg); color:var(--fg); font-family:'VT323', monospace; }
    body{ font-size:calc(1rem * var(--text-scale)); }
    .text-lg{ font-size:calc(1.125rem * var(--text-scale)); line-height:calc(1.75rem * var(--text-scale)); }
    .text-xl{ font-size:calc(1.25rem * var(--text-scale)); line-height:calc(1.75rem * var(--text-scale)); }
    .text-2xl{ font-size:calc(1.5rem * var(--text-scale)); line-height:calc(2rem * var(--text-scale)); }
    .text-3xl{ font-size:calc(1.875rem * var(--text-scale)); line-height:calc(2.25rem * var(--text-scale)); }
    .crt-card{ border:2px solid var(--green); border-radius:12px; background:rgba(0,0,0,.45); }
    .crt-btn{ border:2px solid var(--green); color:var(--fg); background:transparent; padding:.35rem .7rem; border-radius:10px; }
    .crt-btn[disabled]{ opacity:.4; cursor:not-allowed; }
    .crt-btn:hover{ background:var(--greenDim); }
    .number-input::-webkit-outer-spin-button, .number-input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
    .number-input[type=number]{ -moz-appearance:textfield; }
    .scroll-table{ max-height:70vh; overflow:auto; }
    .score-total{ font-size:calc(2.4rem * var(--text-scale)); line-height:1; }
    .score-sub{ font-size:calc(1.0rem * var(--text-scale)); opacity:.95; }
    .label{ font-size:calc(1.0rem * var(--text-scale)); opacity:.95; }
    .muted{ color:rgba(255,255,255,.9); font-size:calc(1.0rem * var(--text-scale)); }
    .accent{ color:var(--green); }
    select, input[type=number], input[type=range], input[type=text]{ background:transparent; color:var(--fg); border:2px solid var(--green); border-radius:10px; padding:.21rem .5rem; font-size:inherit; }
    option{ color:#000; }
    table{ width:100%; }
    th, td{ padding:.28rem .4rem; border-bottom:1px solid rgba(255,255,255,.15); }
    .overlay{ position:fixed; inset:0; background:rgba(0,0,0,.9); display:flex; align-items:center; justify-content:center; z-index:50; }
    .panel{ width:min(95vw,1000px); }
    .pulse{ animation:pulse 1s ease-in-out infinite; }
    @keyframes pulse{ 0%{opacity:.5} 50%{opacity:1} 100%{opacity:.5} }
    .toggle-group{ display:flex; row-gap:.28rem; column-gap:.4rem; flex-wrap:wrap; }
    .toggle-group.nowrap{ flex-wrap:nowrap; overflow:auto; }
    .toggle{ border:2px solid var(--green); border-radius:10px; padding:.245rem .65rem; cursor:pointer; user-select:none; font-size:calc(1.0rem * var(--text-scale)); white-space:nowrap; }
    .toggle.active{ background:var(--green); color:#ffffff; }
    .row { display:grid; grid-template-columns: 1fr auto; gap:.175rem .6rem; align-items:baseline; }
    .row .k { color:rgba(255,255,255,.9); }
    .row .v { color:var(--green); text-align:right; }
    .tight-y > * + * { margin-top:.35rem !important; }
    .tight-card { padding:.42rem .6rem !important; }
    .tight-gap { row-gap:.35rem !important; column-gap:.5rem !important; }

    /* Reduce frequently used Tailwind spacing utilities to 70% of default vertically */
    .p-5{ padding-block:0.875rem !important; }
    .p-4{ padding-block:0.7rem !important; }
    .p-3{ padding-block:0.525rem !important; }
    .p-2{ padding-block:0.35rem !important; }
    .py-3{ padding-top:0.525rem !important; padding-bottom:0.525rem !important; }
    .pt-2{ padding-top:0.35rem !important; }
    .mt-1{ margin-top:0.175rem !important; }
    .mt-2{ margin-top:0.35rem !important; }
    .mb-1{ margin-bottom:0.175rem !important; }
    .mb-2{ margin-bottom:0.35rem !important; }
    .space-y-2 > :not([hidden]) ~ :not([hidden]) {
      --tw-space-y-reverse: 0;
      margin-top: calc(0.35rem * calc(1 - var(--tw-space-y-reverse)));
      margin-bottom: calc(0.35rem * var(--tw-space-y-reverse));
    }
    .space-y-3 > :not([hidden]) ~ :not([hidden]) {
      --tw-space-y-reverse: 0;
      margin-top: calc(0.525rem * calc(1 - var(--tw-space-y-reverse)));
      margin-bottom: calc(0.525rem * var(--tw-space-y-reverse));
    }
    .gap-2{ row-gap:0.35rem !important; }
  </style>
</head>
<body>
  <div id="root" class="min-h-screen"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script>
    const { useState, useMemo } = React;

    /* Families and base expense categories */
    const DEFAULT_FAMILIES = [
      { family_id:1, role:"Serf",   name:"Serfs",   job:"Retail associate", sector:"Retail",
        base_income:5000,  housing:1500, starting_bank:3000, food:600,  clothes:100, misc:200 },
      { family_id:2, role:"Knight", name:"Knights", job:"Butcher",          sector:"Food",
        base_income:8500,  housing:3500, starting_bank:4000, food:800,  clothes:200, misc:300 },
      { family_id:3, role:"Noble",  name:"Nobles",  job:"Nurse",            sector:"Healthcare",
        base_income:15000, housing:8000, starting_bank:5000, food:1200, clothes:500, misc:600 },
      { family_id:4, role:"King",   name:"Kings",   job:"Software",         sector:"Tech",
        base_income:26000, housing:9200, starting_bank:6000, food:1800, clothes:800, misc:1000 }
    ];

    /* Multipliers for econ and happiness */
    const ROLE_MULT = { Serf:4, Knight:2, Noble:2, King:1 };

    /* Investments list */
    const INVESTMENTS = [{name:"IndexFund"}, {name:"Crypto"}, {name:"FriendBusiness"}];

    /* Sectors for admin multipliers */
    const SECTORS = ["Retail","Food","Healthcare","Tech"];

    /* Insurance plans */
    const INSURANCE_PLANS = {
      UnitedHealthcare:{key:"UnitedHealthcare", name:"UnitedHealthcare", premium:300, coverage:0.5, description:"$300 each turn. Covers 50% of medical costs."},
      KaiserPermanente:{key:"KaiserPermanente", name:"Kaiser Permanente", premium:500, coverage:0.7, description:"$500 each turn. Covers 70% of medical costs."},
      AnthemBCBS:{key:"AnthemBCBS", name:"Anthem", premium:800, coverage:0.9, description:"$800 each turn. Covers 90% of medical costs."},
      NoInsurance:{key:"NoInsurance", name:"No insurance", premium:0, coverage:0, description:"$0 each turn. Covers 0% of medical costs."}
    };
    const DEFAULT_PLAN_KEY = "NoInsurance";

    /* Group scenarios */
    const GROUP_EVENTS = [
      { id:1, title:"Your state passed a tax increase", description:"Sales tax will rise next turn.", taxDelta:+0.03,
        choices:[ {key:"A",label:"Shop early for essentials.", cost:300,  happy:2},
                  {key:"B",label:"Split buys between now and next turn.", cost:150, happy:0},
                  {key:"C",label:"Delay a big buy and save for now.", cost:-150, happy:-1} ] },
      { id:2, title:"Scheduled tax cut approved", description:"Sales tax will fall next turn.", taxDelta:-0.03,
        choices:[ {key:"A",label:"Put down a refundable deposit to lock a deal.", cost:150, happy:0},
                  {key:"B",label:"Buy the item now anyway.", cost:400, happy:0},
                  {key:"C",label:"Buy small things now and delay the big one.", cost:120, happy:1} ] },
      { id:3, title:"Refinery outage hit fuel supply", description:"Gas prices spike this turn.",
        choices:[ {key:"A",label:"Monthly transit pass.", cost:129, happy:1},
                  {key:"B",label:"Keep driving as usual.", cost:250, happy:0},
                  {key:"C",label:"Buy an electric scooter for commuting.", cost:500, happy:1} ] },
      { id:4, title:"Utility raised peak rates today", description:"Time of use pricing applies immediately.",
        choices:[ {key:"A",label:"Off peak automation kit for appliances.", cost:150, happy:2},
                  {key:"B",label:"Ignore peak prices and keep routine.", cost:120, happy:-1},
                  {key:"C",label:"Starter efficiency upgrades at home.", cost:400, happy:1} ] },
      { id:5, title:"Weather hurt produce yields", description:"Grocery prices jump.",
        choices:[ {key:"A",label:"Keep quality and buy fresh produce.", cost:300, happy:2},
                  {key:"B",label:"Mix fresh and frozen to manage cost.", cost:180, happy:0},
                  {key:"C",label:"Pivot to staples and bulk.", cost:120, happy:-2} ] },
      { id:6, title:"Key road closed this week", description:"Transit is crowded and roads are jammed.",
        choices:[ {key:"A",label:"Monthly pass with express options.", cost:150, happy:2},
                  {key:"B",label:"Organized carpool with fuel split.", cost:120, happy:0},
                  {key:"C",label:"Drive solo and pay parking.", cost:300, happy:-2} ] },
      { id:7, title:"Phone battery keeps failing", description:"Reliability is now a problem.",
        choices:[ {key:"A",label:"New flagship replacement.", cost:1200, happy:2},
                  {key:"B",label:"Refurb model with warranty.", cost:700, happy:1},
                  {key:"C",label:"Battery replacement and tune up.", cost:150, happy:-1} ] },
      { id:8, title:"Home workloads increased", description:"Your internet plan bottlenecks speed.",
        choices:[ {key:"A",label:"Gigabit upgrade with install.", cost:300, happy:2},
                  {key:"B",label:"Mid tier speed bump.", cost:180, happy:1},
                  {key:"C",label:"Keep current plan and buy a better router.", cost:120, happy:-1} ] },
      { id:9, title:"Banks raised rates on balances", description:"Credit APR is higher.",
        choices:[ {key:"A",label:"Pay down a chunk to cut interest.", cost:600, happy:1},
                  {key:"B",label:"Make a heavier than minimum payment.", cost:200, happy:0},
                  {key:"C",label:"Pay a balance transfer fee to lower APR.", cost:150, happy:-1} ] },
      { id:10, title:"City will match block donations", description:"Park improvements depend on you.",
        choices:[ {key:"A",label:"Donate toward the match target.", cost:300, happy:2},
                  {key:"B",label:"Make a smaller donation to participate.", cost:150, happy:0},
                  {key:"C",label:"Skip donation and use the park anyway.", cost:120, happy:-2} ] }
    ];

    const INSURANCE_EVENT = {
      id:"INS_T1",
      title:"Health insurance choice",
      description:"Open enrollment started. Pick a health insurance plan for your family.",
      isInsurance:true,
      choices:[
        {key:"A",planKey:"UnitedHealthcare",label:"UnitedHealthcare - $300 each turn. Covers 50% of medical costs."},
        {key:"B",planKey:"KaiserPermanente",label:"Kaiser Permanente - $500 each turn. Covers 70% of medical costs."},
        {key:"C",planKey:"AnthemBCBS",label:"Anthem - $800 each turn. Covers 90% of medical costs."},
        {key:"D",planKey:"NoInsurance",label:"No insurance - $0 each turn. Covers 0% of medical costs."}
      ]
    };

    const FAMILY_GENERAL_EVENTS = {
      1:[
        {id:"S-GEN-1",title:"Pantry prep weekend",description:"Choose how much to restock before schedules get wild.",
          choices:[
            {key:"A",label:"Load up on fresh ingredients.",cost:220,happy:2},
            {key:"B",label:"Split between pantry staples and fresh.",cost:120,happy:1},
            {key:"C",label:"Stick to current pantry and defer shopping.",cost:0,happy:-1}
          ]},
        {id:"S-GEN-2",title:"Side hustle planning",description:"Johnny can pick up extra shifts with some tradeoffs.",
          choices:[
            {key:"A",label:"Work overtime and buy easy meals.",cost:150,happy:0},
            {key:"B",label:"Skip shifts and enjoy a rest night.",cost:0,happy:2},
            {key:"C",label:"Split the difference with one shift.",cost:60,happy:1}
          ]}
      ],
      2:[
        {id:"K-GEN-1",title:"Uniform refresh",description:"The butcher shop offered a deal on new uniforms.",
          choices:[
            {key:"A",label:"Full refresh with custom gear.",cost:260,happy:2},
            {key:"B",label:"Replace the worst pieces only.",cost:110,happy:1},
            {key:"C",label:"Keep the current uniforms a bit longer.",cost:0,happy:-1}
          ]},
        {id:"K-GEN-2",title:"Family night plans",description:"Pick how to celebrate the kids' good grades.",
          choices:[
            {key:"A",label:"Theme park day.",cost:320,happy:2},
            {key:"B",label:"Local outing and treats.",cost:140,happy:1},
            {key:"C",label:"Movie night at home.",cost:40,happy:0}
          ]}
      ],
      3:[
        {id:"N-GEN-1",title:"Child enrichment signup",description:"Clubs opened for the new semester.",
          choices:[
            {key:"A",label:"STEM camp plus art lessons.",cost:450,happy:2},
            {key:"B",label:"Pick one activity now and reassess later.",cost:220,happy:1},
            {key:"C",label:"Skip paid programs this session.",cost:0,happy:-1}
          ]},
        {id:"N-GEN-2",title:"Commute comforts",description:"Decide how to handle long shifts this month.",
          choices:[
            {key:"A",label:"Rideshare on call nights.",cost:180,happy:1},
            {key:"B",label:"Transit pass with upgrades.",cost:129,happy:0},
            {key:"C",label:"Drive yourself and skip extras.",cost:60,happy:-1}
          ]}
      ],
      4:[
        {id:"KING-GEN-1",title:"STEM club donation",description:"Support the school's robotics club?",
          choices:[
            {key:"A",label:"Fund new kits.",cost:400,happy:2},
            {key:"B",label:"Cover a few spare parts.",cost:180,happy:1},
            {key:"C",label:"Offer mentoring only.",cost:0,happy:0}
          ]},
        {id:"KING-GEN-2",title:"Weekend recharge",description:"Pick how Kendall restores energy before exams.",
          choices:[
            {key:"A",label:"Wellness retreat.",cost:500,happy:2},
            {key:"B",label:"Family day trip.",cost:200,happy:1},
            {key:"C",label:"Staycation at home.",cost:60,happy:0}
          ]}
      ]
    };

    const FAMILY_INJURY_EVENTS = {
      1:[
        {id:"S-INJ-1",title:"Johnny strained his wrist",description:"Johnny lifted heavy boxes at work. Insurance coverage applies to the sticker price. You pay the uncovered share. No sales tax on medical.",choices:[
          {key:"A",label:"Same day urgent care with brace and follow up.",cost:600,happy:2,medical:true},
          {key:"B",label:"Next day clinic visit and over the counter brace.",cost:300,happy:0,medical:true},
          {key:"C",label:"Self care with wrap and missed hours.",cost:150,happy:-2,medical:true}
        ]}
      ],
      2:[
        {id:"K-INJ-1",title:"Mary rolled her ankle",description:"Mary rolled her ankle at school soccer. Insurance coverage applies to the sticker price. You pay the uncovered share. No sales tax on medical.",choices:[
          {key:"A",label:"Emergency room with full imaging and ortho referral.",cost:1800,happy:1,medical:true},
          {key:"B",label:"Urgent care X-ray and ortho follow up.",cost:900,happy:2,medical:true},
          {key:"C",label:"Telehealth consult and brace only.",cost:200,happy:-2,medical:true}
        ]}
      ],
      3:[
        {id:"N-INJ-1",title:"Baby's ear infection",description:"The baby's cold worsened into a painful ear infection. Insurance coverage applies to the sticker price. You pay the uncovered share. No sales tax on medical.",choices:[
          {key:"A",label:"Pediatrician same day with antibiotics.",cost:250,happy:2,medical:true},
          {key:"B",label:"Urgent care with short wait.",cost:350,happy:1,medical:true},
          {key:"C",label:"Watchful waiting with home supplies.",cost:150,happy:-2,medical:true}
        ]}
      ],
      4:[
        {id:"KING-INJ-1",title:"Kendall felt a knee pop",description:"Kendall felt a knee pop in PE class. Insurance coverage applies to the sticker price. You pay the uncovered share. No sales tax on medical.",choices:[
          {key:"A",label:"MRI first then ortho plan.",cost:1600,happy:2,medical:true},
          {key:"B",label:"Physical therapy evaluation first.",cost:600,happy:1,medical:true},
          {key:"C",label:"Rest and ice with supplies.",cost:120,happy:-2,medical:true}
        ]}
      ]
    };

    function pickRandom(list){
      if(!list || list.length === 0) return null;
      var idx = Math.floor(Math.random() * list.length);
      return list[idx];
    }

    function buildFamilyEventMap(turnNumber){
      var map = {};
      DEFAULT_FAMILIES.forEach(function(f){
        var pool = [];
        if(turnNumber === 1){
          pool = FAMILY_GENERAL_EVENTS[f.family_id] || [];
        } else if(turnNumber === 2){
          pool = FAMILY_INJURY_EVENTS[f.family_id] || [];
        } else {
          pool = (FAMILY_GENERAL_EVENTS[f.family_id] || []).concat(FAMILY_INJURY_EVENTS[f.family_id] || []);
        }
        map[f.family_id] = pickRandom(pool) || null;
      });
      return map;
    }

    function fmt(n){ return new Intl.NumberFormat(undefined,{style:"currency",currency:"USD"}).format(n||0); }
    function clamp(x,lo,hi){ return Math.max(lo, Math.min(hi,x)); }
    function csvEscape(v){ var s=String(v==null?"":v); if(s.indexOf('"')>-1||s.indexOf(',')>-1||s.indexOf('\n')>-1){ return '"' + s.split('"').join('""') + '"'; } return s; }
    function toCSV(rows){ if(!rows||rows.length===0) return ""; var headers=Object.keys(rows[0]); var lines=[headers.join(',')]; for(var i=0;i<rows.length;i++){ var r=rows[i]; lines.push(headers.map(function(h){return csvEscape(r[h]);}).join(',')); } return lines.join("\n"); }
    function randBetween(a,b){ return a + Math.random()*(b-a); }
    function fmtUnits(n){ return (n||0).toFixed(4).replace(/\.?0+$/,''); }

    function App(){
      const [turn, setTurn] = useState(1);
      const [salesTaxNow, setSalesTaxNow] = useState(0.06);
      const [salesTaxNext, setSalesTaxNext] = useState(0.06);
      const [pendingTaxDelta, setPendingTaxDelta] = useState(0);
      const [taxDeltaRecordedTurn, setTaxDeltaRecordedTurn] = useState(null);

      const [sectorMult, setSectorMult] = useState({Retail:1.0,Food:1.0,Healthcare:1.0,Tech:1.0});

      const initialBank = useMemo(function(){ return Object.fromEntries(DEFAULT_FAMILIES.map(function(f){return [f.family_id,f.starting_bank];})); },[]);
      const [bank, setBank] = useState(initialBank);
      const [chosenInsurance, setChosenInsurance] = useState(Object.fromEntries(DEFAULT_FAMILIES.map(function(f){return [f.family_id,DEFAULT_PLAN_KEY];})));
      const [ledger, setLedger] = useState([]);

      const [gainVsStart, setGainVsStart] = useState(Object.fromEntries(DEFAULT_FAMILIES.map(function(f){return [f.family_id,0];})));
      const [econPoints, setEconPoints] = useState(Object.fromEntries(DEFAULT_FAMILIES.map(function(f){return [f.family_id,0];})));
      const [happyPoints, setHappyPoints] = useState(Object.fromEntries(DEFAULT_FAMILIES.map(function(f){return [f.family_id,0];})));

      const [currentFamilyIdx, setCurrentFamilyIdx] = useState(0);
      const currentFamily = DEFAULT_FAMILIES[currentFamilyIdx];
      const [submittedMap, setSubmittedMap] = useState(Object.fromEntries(DEFAULT_FAMILIES.map(function(f){return [f.family_id,false];})));
      const [groupEventCurrent, setGroupEventCurrent] = useState(INSURANCE_EVENT);
      const [familyEventMap, setFamilyEventMap] = useState(function(){ return buildFamilyEventMap(1); });

      const [groupChoiceKey, setGroupChoiceKey] = useState("");
      const [familyChoiceKey, setFamilyChoiceKey] = useState("");

      const [invAction, setInvAction] = useState("");
      const [invName, setInvName] = useState("");
      const [invAmtStr, setInvAmtStr] = useState("");

      const [showLedger, setShowLedger] = useState(false);
      const [showScores, setShowScores] = useState(false);
      const [scoreFamilyId, setScoreFamilyId] = useState(null);
      const [showEnd, setShowEnd] = useState(false);
      const [showAdmin, setShowAdmin] = useState(false);
      const [showIntro, setShowIntro] = useState(true);
      const [showExpenses, setShowExpenses] = useState(false);
      const [anim, setAnim] = useState(false);

      const famMap = useMemo(function(){ return Object.fromEntries(DEFAULT_FAMILIES.map(function(f){return [f.family_id,f];})); },[]);
      const isTurn1 = turn === 1;
      const groupEvent = groupEventCurrent;
      const familyEvent = familyEventMap[currentFamily.family_id] || null;

      /* market */
      const [investmentPrices, setInvestmentPrices] = useState(Object.fromEntries(INVESTMENTS.map(function(x){return [x.name,100];})));
      const [portfolioUnits, setPortfolioUnits] = useState(Object.fromEntries(
        DEFAULT_FAMILIES.map(function(f){
          return [f.family_id, Object.fromEntries(INVESTMENTS.map(function(x){return [x.name,0];}))];
        })
      ));

      function calcHoldingsValue(fid, unitsOverride, pricesOverride){
        var units = (unitsOverride || portfolioUnits)[fid] || {};
        var prices = pricesOverride || investmentPrices;
        var total = 0;
        INVESTMENTS.forEach(function(x){
          var u = units[x.name] || 0;
          var p = prices[x.name] || 100;
          total += u * p;
        });
        return total;
      }

      function updateMarketPrices(){
        setInvestmentPrices(function(prev){
          var next = Object.assign({}, prev);
          INVESTMENTS.forEach(function(x){
            var p = prev[x.name] || 100;
            var r = 0;
            if(x.name === "IndexFund")      r = randBetween(-0.10, 0.20);
            else if(x.name === "Crypto")    r = randBetween(-0.99, 2.00);
            else if(x.name === "FriendBusiness") r = randBetween(-0.20, 0.40);
            var np = p * (1 + r);
            next[x.name] = Math.max(1, Number(np.toFixed(2)));
          });
          return next;
        });
      }

      function allSubmitted(){ return DEFAULT_FAMILIES.every(function(f){ return submittedMap[f.family_id]; }); }
      function resetSubmitted(){ setSubmittedMap(Object.fromEntries(DEFAULT_FAMILIES.map(function(f){return [f.family_id,false];}))); }
      function goNextFamily(){
        for(var i=1;i<=DEFAULT_FAMILIES.length;i++){
          var idx=(currentFamilyIdx+i)%DEFAULT_FAMILIES.length;
          var f=DEFAULT_FAMILIES[idx];
          if(!submittedMap[f.family_id]){ setCurrentFamilyIdx(idx); return; }
        }
      }

      function prepareEventsForTurn(nextTurn){
        if(nextTurn === 1){
          setGroupEventCurrent(INSURANCE_EVENT);
        } else {
          setGroupEventCurrent(pickRandom(GROUP_EVENTS) || GROUP_EVENTS[0]);
        }
        setFamilyEventMap(buildFamilyEventMap(nextTurn));
      }

    function fmtSignedNumber(n, suffix){
      if(typeof n !== "number" || isNaN(n)) return suffix ? "0"+suffix : "0";
      var rounded = Math.abs(n - Math.round(n)) < 1e-9 ? Math.round(n) : Math.round(n * 100) / 100;
      if(rounded === 0) rounded = 0; /* avoid -0 */
      var str = (rounded>=0?"+":"") + rounded;
      return suffix ? str + suffix : str;
    }

    function dispHappy(h){
        var hd = (typeof h==="number") ? h*10 : 0; /* label shows 10x */
        if(hd > 0) return "+"+hd+" Happy";
        if(hd < 0) return hd+" Happy";
        return "+0 Happy";
      }
      function dispCost(c){
        if(typeof c !== "number" || c === 0) return "-$0";
        return c > 0 ? "-$"+Math.abs(c) : "+$"+Math.abs(c);
      }

      function ChoiceToggles(props){
        var choices = props.choices, selectedKey = props.selectedKey, onSelect = props.onSelect, showMeta = props.showMeta;
        return React.createElement("div",{className:"toggle-group"},
          choices.map(function(c){
            var label = c.key + ". " + c.label;
            if(showMeta){
              label += " (" + dispHappy(c.happy) + ", " + dispCost(c.cost) + ")";
            }
            return React.createElement('span',{
              key:c.key,
              className:'toggle'+(selectedKey===c.key?' active':''),
              onClick:function(){ onSelect(c.key); }
            }, label);
          })
        );
      }

      function resolveFamilyChoice(choice, planInfo){
        if(!choice) return { netCost:0, taxableCost:0 };
        var baseCost = choice.cost || 0;

              React.createElement("div",{className:"v"}, fmt(fam.clothes))
            ),
            React.createElement("div",{className:"row"},
              React.createElement("div",{className:"k"},"Misc"),
              React.createElement("div",{className:"v"}, fmt(fam.misc))
            ),
            (function(){
              var g = (!groupEvent.isInsurance && groupChoiceKey) ? (groupEvent.choices.find(function(c){return c.key===groupChoiceKey;}) || null) : null;
              if(g && g.cost !== 0){
                return React.createElement("div",{className:"row"},
                  React.createElement("div",{className:"k"},"Group choice"),
                  React.createElement("div",{className:"v"}, fmt(g.cost))
                );
              }
              return null;
            })(),
            (function(){
              var fch = familyEvent && familyChoiceKey ? familyEvent.choices.find(function(c){return c.key===familyChoiceKey;}) : null;
              if(fch){
                var calc = resolveFamilyChoice(fch, planShow);
                if(calc.netCost !== 0){
                  return React.createElement("div",{className:"row"},
                    React.createElement("div",{className:"k"},"Family choice"),
                    React.createElement("div",{className:"v"}, fmt(calc.netCost))
                  );
                }
              }
              return null;
            })(),
            
            React.createElement("div",{className:"row"},
              React.createElement("div",{className:"k"},"Sales tax"),
              React.createElement("div",{className:"v"}, fmt(taxableShow * salesTaxNow))
            ),
            React.createElement("div",{className:"row mt-1"},
              React.createElement("div",{className:"k muted"},"Total expenses"),
              React.createElement("div",{className:"v accent"}, fmt(expensesTotalShow))
            ),
            React.createElement("div",{className:"text-right mt-2"},
              React.createElement("button",{className:"crt-btn",onClick:function(){setShowExpenses(false);}},"Close")
            )
          )
        ) : null,

        /* LEDGER MODAL */
        showLedger ? React.createElement("div",{className:"overlay"},
          React.createElement("div",{className:"crt-card p-4 panel"},
            React.createElement("div",{className:"flex items-center justify-between mb-2"},
              React.createElement("h3",{className:"text-xl"},"Ledger"),
              React.createElement("div",{className:"flex gap-2"},
                React.createElement("button",{className:"crt-btn",onClick:function(){
                  var csv=toCSV(ledger); var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
                  var url=URL.createObjectURL(blob); var a=document.createElement('a'); a.href=url; a.download='ledger.csv'; a.click(); URL.revokeObjectURL(url);
                }},"Download CSV"),
                React.createElement("button",{className:"crt-btn",onClick:function(){setShowLedger(false);}},"Close")
              )
            ),
            ledger.length===0 ? React.createElement("div",{className:"muted"},"No entries yet.") :
            React.createElement("div",{className:"scroll-table"},
              React.createElement("table",null,
                React.createElement("thead",null,
                  React.createElement("tr",null,
                    ["turn","role","family","income","housing","insurance","group_spend","family_spend","sales_tax_paid","investments_realized","net_change","bank_after","econ_earned","happy_earned","econ_total","happy_total","points_total","notes"].map(function(h){
                      return React.createElement("th",{key:h},h.split('_').join(' '));
                    })
                  )
                ),
                React.createElement("tbody",null,
                  ledger.slice().reverse().map(function(row,idx){
                    return React.createElement("tr",{key:idx},
                      React.createElement("td",null,row.turn),
                      React.createElement("td",null,row.role),
                      React.createElement("td",null,row.family),
                      React.createElement("td",null,fmt(row.income)),
                      React.createElement("td",null,fmt(row.housing)),
                      React.createElement("td",null,fmt(row.insurance)),
                      React.createElement("td",null,fmt(row.group_spend)),
                      React.createElement("td",null,fmt(row.family_spend)),
                      React.createElement("td",null,fmt(row.sales_tax_paid)),
                      React.createElement("td",null,fmt(row.investments_realized)),
                      React.createElement("td",null,fmt(row.net_change)),
                      React.createElement("td",null,fmt(row.bank_after)),
                      React.createElement("td",null,Math.round(row.econ_earned)),
                      React.createElement("td",null,Math.round(row.happy_earned)),
                      React.createElement("td",null,Math.round(row.econ_total)),
                      React.createElement("td",null,Math.round(row.happy_total)),
                      React.createElement("td",null,Math.round(row.points_total)),
                      React.createElement("td",null,row.notes)
                    );
                  })
                )
              )
            )
          )
        ) : null,

        /* SCORES MODAL */
        showScores ? React.createElement("div",{className:"overlay"},
          (function(){
            var fallbackFam = DEFAULT_FAMILIES[0];
            var activeFam = DEFAULT_FAMILIES.find(function(f){ return f.family_id === (scoreFamilyId || fallbackFam.family_id); }) || fallbackFam;
            var summary = perFamilyScores.find(function(s){ return s.fid === activeFam.family_id; }) || {econ:0,happy:0,total:0};
            var famRows = ledger.filter(function(row){ return row.family === activeFam.name; }).slice().sort(function(a,b){ return a.turn - b.turn; });
            return React.createElement("div",{className:"crt-card p-5 panel space-y-3"},
              React.createElement("div",{className:"flex items-center justify-between"},
                React.createElement("h3",{className:"text-2xl"},"Score breakdown"),
                React.createElement("button",{className:"crt-btn",onClick:function(){setShowScores(false);}},"Close")
              ),
              React.createElement("div",{className:"toggle-group"},
                DEFAULT_FAMILIES.map(function(f){
                  return React.createElement("span",{
                    key:f.family_id,
                    className:'toggle'+(f.family_id===activeFam.family_id?' active':''),
                    onClick:function(){ setScoreFamilyId(f.family_id); }
                  },f.name);
                })
              ),
              React.createElement("div",{className:"crt-card p-3"},
                React.createElement("div",{className:"text-xl mb-1"}, activeFam.name + " (" + activeFam.role + ")"),
                React.createElement("div",{className:"grid grid-cols-3 gap-2"},
                  React.createElement("div",{className:"crt-card p-2 text-center"},
                    React.createElement("div",{className:"muted"},"Total"),
                    React.createElement("div",{className:"score-total accent font-bold"}, summary.total)
                  ),
                  React.createElement("div",{className:"crt-card p-2 text-center"},
                    React.createElement("div",{className:"muted"},"Economic"),
                    React.createElement("div",{className:"score-sub accent font-bold"}, summary.econ)
                  ),
                  React.createElement("div",{className:"crt-card p-2 text-center"},
                    React.createElement("div",{className:"muted"},"Happiness"),
                    React.createElement("div",{className:"score-sub accent font-bold"}, summary.happy)
                  )
                )
              ),
              famRows.length === 0
                ? React.createElement("div",{className:"muted"},"No turns submitted yet.")
                : React.createElement("div",{className:"space-y-3 max-h-[60vh] overflow-auto"},
                    famRows.map(function(row,idx){
                      var econDetail = row.econ_detail || null;
                      var happyDetail = row.happy_detail || null;
                      return React.createElement("div",{key:row.turn+"-"+idx,className:"crt-card p-3 space-y-2"},
                        React.createElement("div",{className:"flex items-center justify-between"},
                          React.createElement("div",{className:"text-lg"},"Turn "+row.turn),
                          React.createElement("div",{className:"accent font-bold"}, "+"+Math.round(row.econ_earned + row.happy_earned)+" pts")
                        ),
                        React.createElement("div",{className:"space-y-1"},
                          React.createElement("div",{className:"muted font-bold"},"Economic +" + Math.round(row.econ_earned) + " pts"),
                          econDetail
                            ? React.createElement("div",{className:"text-sm"},
                                econDetail.net_gain > 0
                                  ? ("Net worth gain " + fmt(econDetail.net_gain) + " => base " +
                                      econDetail.base_points.toFixed(2) + " pts x role x" + econDetail.role_multiplier +
                                      " = +" + econDetail.awarded + " pts")
                                  : "No new net worth peak this turn."
                              )
                            : React.createElement("div",{className:"text-sm"},"No economic change recorded.")
                        ),
                        React.createElement("div",{className:"space-y-1"},
                          React.createElement("div",{className:"muted font-bold"},"Happiness +" + Math.round(row.happy_earned) + " pts"),
                          happyDetail && happyDetail.components && happyDetail.components.length
                            ? React.createElement("div",{className:"text-sm space-y-1"},
                                React.createElement("div",null,"Components:"),
                                React.createElement("ul",{className:"list-disc ml-5 space-y-1"},
                                  happyDetail.components.map(function(comp,i){
                                    return React.createElement("li",{key:i},
                                      comp.label + ": " + fmtSignedNumber(comp.value," Happy")
                                    );
                                  })
                                ),
                                React.createElement("div",null,
                                  "Base " + fmtSignedNumber(happyDetail.base_total," Happy") +
                                  " => +" + happyDetail.awarded + " pts"
                                )
                              )
                            : React.createElement("div",{className:"text-sm"},"No happiness changes this turn.")
                        )
                      );
                    })
                  )
            );
          })()
        ) : null,

        /* ADMIN MODAL */
        showAdmin ? React.createElement("div",{className:"overlay"},
          React.createElement("div",{className:"crt-card p-5 panel space-y-3"},
            React.createElement("div",{className:"flex items-center justify-between"},
              React.createElement("h3",{className:"text-2xl"},"Admin Controls"),
              React.createElement("button",{className:"crt-btn",onClick:function(){setShowAdmin(false);}},"Close")
            ),
            React.createElement("div",null,
              React.createElement("div",{className:"label"},"Sales tax next turn"),
              React.createElement("input",{type:"range",min:0,max:0.15,step:0.01,value:salesTaxNext,onChange:function(e){setSalesTaxNext(Number(e.target.value));},className:"w-full"}),
              React.createElement("div",{className:"muted"}, (salesTaxNext*100).toFixed(1)+"%")
            ),
            React.createElement("div",{className:"grid grid-cols-1 md:grid-cols-2 gap-2"},
              SECTORS.map(function(sec){
                return React.createElement("div",{key:sec,className:"crt-card p-3"},
                  React.createElement("div",{className:"flex justify-between muted"},
                    React.createElement("span",null,sec),
                    React.createElement("span",null,sectorMult[sec].toFixed(2))
                  ),
                  React.createElement("input",{type:"range",min:0.5,max:1.5,step:0.05,value:sectorMult[sec],onChange:function(e){var m=Object.assign({},sectorMult); m[sec]=Number(e.target.value); setSectorMult(m);},className:"w-full mt-2"})
                );
              })
            )
          )
        ) : null,

        /* END SCREEN */
        showEnd ? React.createElement("div",{className:"overlay"},
          React.createElement("div",{className:"crt-card p-5 panel space-y-3"},
            React.createElement("h2",{className:"text-3xl text-center"},"Final Scores"),
            React.createElement("div",{className:"grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-2"},
              perFamilyScores.map(function(s){
                return React.createElement("div",{key:s.fid,className:"crt-card p-3 text-center"},
                  React.createElement("div",{className:"muted"}, s.name + " (" + s.role + ")"),
                  React.createElement("div",{className:"score-total font-bold mt-1 accent"}, s.total),
                  React.createElement("div",{className:"mt-1 grid grid-cols-2 gap-2"},
                    React.createElement("div",{className:"crt-card p-2"},
                      React.createElement("div",{className:"muted"},"Economic"),
                      React.createElement("div",{className:"score-sub accent font-bold"}, s.econ)
                    ),
                    React.createElement("div",{className:"crt-card p-2"},
                      React.createElement("div",{className:"muted"},"Happiness"),
                      React.createElement("div",{className:"score-sub accent font-bold"}, s.happy)
                    )
                  )
                );
              })
            ),
            React.createElement("div",{className:"crt-card p-3"},
              React.createElement("table",{className:"w-full"},
                React.createElement("thead",null,
                  React.createElement("tr",null, ["Family","Role","Start net worth","End net worth"].map(function(h){return React.createElement("th",{key:h},h);}))
                ),
                React.createElement("tbody",null,
                  DEFAULT_FAMILIES.map(function(f){
                    var startNW = f.starting_bank; // no starting investments
                    var endNW = (bank[f.family_id]||0) + calcHoldingsValue(f.family_id);
                    return React.createElement("tr",{key:f.family_id},
                      React.createElement("td",null,f.name),
                      React.createElement("td",null,f.role),
                      React.createElement("td",null,fmt(startNW)),
                      React.createElement("td",null,fmt(endNW))
                    );
                  })
                )
              )
            ),
            React.createElement("div",{className:"flex justify-end"},
              React.createElement("button",{className:"crt-btn",onClick:restartGame},"Restart")
            )
          )
        ) : null,

        /* TURN ANIMATION */
        anim ? React.createElement("div",{className:"overlay"},
          React.createElement("div",{className:"text-3xl pulse"},"Advancing to Turn "+turn)
        ) : null
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(React.createElement(App));
  </script>
</body>
</html>
