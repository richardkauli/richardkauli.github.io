<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Classroom Economy Game</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{
      --fg:#ffffff;
      --green:#22c55e;
      --bg:#000000;
      --greenDim: rgba(34,197,94,.12);
    }
    html, body { height:100%; background:var(--bg); color:var(--fg); font-family:'VT323', monospace; }
    .crt-card{ border:2px solid var(--green); border-radius:12px; background:rgba(0,0,0,.45); }
    .crt-btn{ border:2px solid var(--green); color:var(--fg); background:transparent; padding:.5rem .7rem; border-radius:10px; }
    .crt-btn[disabled]{ opacity:.4; cursor:not-allowed; }
    .crt-btn:hover{ background:var(--greenDim); }
    .number-input::-webkit-outer-spin-button, .number-input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
    .number-input[type=number]{ -moz-appearance:textfield; }
    .scroll-table{ max-height:70vh; overflow:auto; }
    .score-total{ font-size:2.4rem; line-height:1; }
    .score-sub{ font-size:1.0rem; opacity:.95; }
    .label{ font-size:1.0rem; opacity:.95; }
    .muted{ color:rgba(255,255,255,.9); font-size:1.0rem; }
    .accent{ color:var(--green); }
    select, input[type=number], input[type=range], input[type=text]{ background:transparent; color:var(--fg); border:2px solid var(--green); border-radius:10px; padding:.3rem .5rem; }
    option{ color:#000; }
    table{ width:100%; }
    th, td{ padding:.4rem; border-bottom:1px solid rgba(255,255,255,.15); }
    .overlay{ position:fixed; inset:0; background:rgba(0,0,0,.9); display:flex; align-items:center; justify-content:center; z-index:50; }
    .panel{ width:min(95vw,1000px); }
    .pulse{ animation:pulse 1s ease-in-out infinite; }
    @keyframes pulse{ 0%{opacity:.5} 50%{opacity:1} 100%{opacity:.5} }
    .toggle-group{ display:flex; gap:.4rem; flex-wrap:wrap; }
    .toggle-group.nowrap{ flex-wrap:nowrap; overflow:auto; }
    .toggle{ border:2px solid var(--green); border-radius:10px; padding:.35rem .65rem; cursor:pointer; user-select:none; font-size:1.0rem; white-space:nowrap; }
    .toggle.active{ background:var(--green); color:#ffffff; }
    .row { display:grid; grid-template-columns: 1fr auto; gap:.25rem .6rem; align-items:baseline; }
    .row .k { color:rgba(255,255,255,.9); }
    .row .v { color:var(--green); text-align:right; }
    /* tighter layout */
    .tight-y > * + * { margin-top:.5rem !important; }
    .tight-card { padding:.6rem !important; }
    .tight-gap { gap:.5rem !important; }
  </style>
</head>
<body>
  <div id="root" class="min-h-screen"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script>
    const { useState, useMemo } = React;

    /* Families and base expense categories */
    const DEFAULT_FAMILIES = [
      { family_id:1, role:"Serf",   name:"Serfs",   job:"Retail associate", sector:"Retail",
        base_income:5000,  housing:1500, starting_bank:3000, food:600,  clothes:100, misc:200 },
      { family_id:2, role:"Knight", name:"Knights", job:"Butcher",          sector:"Food",
        base_income:8500,  housing:3500, starting_bank:4000, food:800,  clothes:200, misc:300 },
      { family_id:3, role:"Noble",  name:"Nobles",  job:"Nurse",            sector:"Healthcare",
        base_income:15000, housing:8000, starting_bank:5000, food:1200, clothes:500, misc:600 },
      { family_id:4, role:"King",   name:"Kings",   job:"Software",         sector:"Tech",
        base_income:26000, housing:9200, starting_bank:6000, food:1800, clothes:800, misc:1000 }
    ];

    /* Multipliers for econ and happiness */
    const ROLE_MULT = { Serf:8, Knight:4, Noble:4, King:1 };

    /* Investments list */
    const INVESTMENTS = [{name:"IndexFund"}, {name:"Crypto"}, {name:"FriendBusiness"}];

    /* Sectors for admin multipliers */
    const SECTORS = ["Retail","Food","Healthcare","Tech"];

    /* Insurance mapping used on Turn 1 only */
    const INSURER_MAP = { "Aetna":"Aetna", "Coventry":"Aetna", "Humana":"Aetna", "Cigna":"Anthem", "Health Spring":"Anthem", "Anthem":"Anthem" };
    const INSURERS = { Aetna:800, Anthem:850 };

    /* Group and family events */
    const GROUP_EVENTS = [
      { id:1, title:"Sales tax increase next turn", description:"Government will raise sales tax next turn by 3%.", taxDelta:+0.03,
        choices:[ {key:"A",label:"Increase clothing spend by 200", cost:200,  happy:2},
                  {key:"B",label:"No change",                       cost:0,    happy:0},
                  {key:"C",label:"Cut clothing by 100",             cost:-100, happy:-1} ] },
      { id:2, title:"Sales tax cut next turn", description:"Government will cut sales tax next turn by 3%.", taxDelta:-0.03,
        choices:[ {key:"A",label:"Treat yourself a bit", cost:120, happy:1},
                  {key:"B",label:"No change",            cost:0,   happy:0},
                  {key:"C",label:"Save instead",         cost:-80, happy:1} ] },
      { id:3, title:"Fuel price spike", description:"Higher gas shifts budgets to complements of transit.",
        choices:[ {key:"A",label:"Transit and carpool", cost:50,  happy:1},
                  {key:"B",label:"Drive as usual",      cost:200, happy:0},
                  {key:"C",label:"Buy electric scooter", cost:400, happy:1} ] },
      { id:4, title:"Stimulus checks arrive", description:"Households receive 500 in one-time cash.",
        choices:[ {key:"A",label:"Spend it",  cost:-500, happy:2},
                  {key:"B",label:"Save it",   cost:-500, happy:1},
                  {key:"C",label:"Invest it", cost:-500, happy:1} ] },
      { id:5, title:"Credit APR hike", description:"Interest rates rise on revolving credit.",
        choices:[ {key:"A",label:"Pay down balance", cost:300, happy:1},
                  {key:"B",label:"Minimum only",     cost:50,  happy:-1},
                  {key:"C",label:"Balance transfer fee", cost:75, happy:0} ] },
      { id:6, title:"Drought hits produce", description:"Food prices rise.",
        choices:[ {key:"A",label:"Switch to staples", cost:60,  happy:0},
                  {key:"B",label:"Keep quality",      cost:220, happy:1},
                  {key:"C",label:"Bulk cook",         cost:120, happy:1} ] },
      { id:7, title:"Congestion pricing", description:"Commuting costs change.",
        choices:[ {key:"A",label:"Monthly transit pass", cost:129, happy:1},
                  {key:"B",label:"Carpool permits",     cost:60,  happy:0},
                  {key:"C",label:"Drive solo",          cost:250, happy:-1} ] },
      { id:8, title:"Public goods drive", description:"Neighborhood park fund.",
        choices:[ {key:"A",label:"Donate modestly", cost:50,  happy:1},
                  {key:"B",label:"Donate generously", cost:200, happy:2},
                  {key:"C",label:"Opt out",           cost:0,   happy:0} ] },
      { id:9, title:"Tech sale week", description:"Discount temptations.",
        choices:[ {key:"A",label:"Buy laptop",      cost:1200, happy:1},
                  {key:"B",label:"Buy refurbished", cost:600,  happy:1},
                  {key:"C",label:"Wait",            cost:0,    happy:0} ] }
    ];

    const INSURANCE_EVENT = {
      id:'INS_T1', title:"Choose health insurance", description:"Pick a plan. Your choice sets your monthly premium.", isInsurance:true,
      choices:[ {key:"A",label:"Aetna"}, {key:"B",label:"Coventry"}, {key:"C",label:"Humana"},
                {key:"D",label:"Cigna"}, {key:"E",label:"Health Spring"}, {key:"F",label:"Anthem"} ]
    };

    const FAMILY_EVENTS_BY_FAMILY = {
      1:[
        {id:101,title:"Daycare for Timmy",description:"Pick care for your toddler",choices:[
          {key:"A",label:"Local daycare class of 40",cost:800,happy:1},
          {key:"B",label:"Montessori school",cost:1000,happy:2},
          {key:"C",label:"Family and friends help",cost:200,happy:0}
        ]},
        {id:102,title:"Timmy wants cello",description:"He found a used cello",choices:[
          {key:"A",label:"Lessons plus instrument",cost:500,happy:2},
          {key:"B",label:"Not now",cost:0,happy:-1},
          {key:"C",label:"Rent instrument only",cost:120,happy:1}
        ]},
        {id:103,title:"Grocery brand choice",description:"Inferior vs normal goods",choices:[
          {key:"A",label:"Store brand swap",cost:40,happy:0},
          {key:"B",label:"Name brands",cost:110,happy:1},
          {key:"C",label:"Coupons and plan",cost:20,happy:1}
        ]}
      ],
      2:[
        {id:201,title:"Rent increase",description:"Landlord raises rent",choices:[
          {key:"A",label:"Stay and pay higher",cost:500,happy:-1},
          {key:"B",label:"Move farther, more gas",cost:200,happy:-1},
          {key:"C",label:"Short term loan",cost:2000,happy:-2}
        ]},
        {id:202,title:"Teen insurance spike",description:"Accident raises insurance",choices:[
          {key:"A",label:"Bike to school",cost:100,happy:0},
          {key:"B",label:"Use rideshare",cost:350,happy:0},
          {key:"C",label:"Pay the increase",cost:6000,happy:-2}
        ]},
        {id:203,title:"Meat demand surge",description:"Butcher hours rise",choices:[
          {key:"A",label:"Overtime gear and meals",cost:180,happy:1},
          {key:"B",label:"Decline overtime",cost:0,happy:0},
          {key:"C",label:"Hire helper one week",cost:400,happy:1}
        ]}
      ],
      3:[
        {id:301,title:"Infant daycare",description:"Two options open up",choices:[
          {key:"A",label:"Local daycare",cost:2900,happy:1},
          {key:"B",label:"Private daycare with friends",cost:3500,happy:2},
          {key:"C",label:"Nanny share part time",cost:1800,happy:1}
        ]},
        {id:302,title:"Long commute tradeoff",description:"New hospital role",choices:[
          {key:"A",label:"Transit pass",cost:129,happy:0},
          {key:"B",label:"Decline offer",cost:0,happy:0},
          {key:"C",label:"Drive and parking",cost:350,happy:-1}
        ]},
        {id:303,title:"Continuing education",description:"Human capital",choices:[
          {key:"A",label:"Certification",cost:1200,happy:2},
          {key:"B",label:"Reimbursed later",cost:600,happy:1},
          {key:"C",label:"Skip this year",cost:0,happy:0}
        ]}
      ],
      4:[
        {id:401,title:"Prep school decision",description:"Improve college chances",choices:[
          {key:"A",label:"Send one teen",cost:1900,happy:1},
          {key:"B",label:"Send both",cost:3800,happy:2},
          {key:"C",label:"Stay public",cost:0,happy:0}
        ]},
        {id:402,title:"College books and fees",description:"First semester bills",choices:[
          {key:"A",label:"All new books",cost:600,happy:-1},
          {key:"B",label:"Used and rentals",cost:220,happy:1},
          {key:"C",label:"Library and PDFs only",cost:40,happy:0}
        ]},
        {id:403,title:"Home services bundle",description:"Complementary goods",choices:[
          {key:"A",label:"Gigabit internet and TV",cost:280,happy:2},
          {key:"B",label:"Internet only",cost:120,happy:1},
          {key:"C",label:"Keep current plan",cost:0,happy:0}
        ]}
      ]
    };

    function fmt(n){ return new Intl.NumberFormat(undefined,{style:"currency",currency:"USD"}).format(n||0); }
    function clamp(x,lo,hi){ return Math.max(lo, Math.min(hi,x)); }
    function csvEscape(v){ var s=String(v==null?"":v); if(s.indexOf('"')>-1||s.indexOf(',')>-1||s.indexOf('\n')>-1){ return '"' + s.split('"').join('""') + '"'; } return s; }
    function toCSV(rows){ if(!rows||rows.length===0) return ""; var headers=Object.keys(rows[0]); var lines=[headers.join(',')]; for(var i=0;i<rows.length;i++){ var r=rows[i]; lines.push(headers.map(function(h){return csvEscape(r[h]);}).join(',')); } return lines.join("\n"); }
    function randBetween(a,b){ return a + Math.random()*(b-a); }
    function fmtUnits(n){ return (n||0).toFixed(4).replace(/\.?0+$/,''); }

    function App(){
      const [turn, setTurn] = useState(1);
      const [salesTaxNow, setSalesTaxNow] = useState(0.06);
      const [salesTaxNext, setSalesTaxNext] = useState(0.06);
      const [pendingTaxDelta, setPendingTaxDelta] = useState(0);
      const [taxDeltaRecordedTurn, setTaxDeltaRecordedTurn] = useState(null);

      const [sectorMult, setSectorMult] = useState({Retail:1.0,Food:1.0,Healthcare:1.0,Tech:1.0});

      const initialBank = useMemo(function(){ return Object.fromEntries(DEFAULT_FAMILIES.map(function(f){return [f.family_id,f.starting_bank];})); },[]);
      const [bank, setBank] = useState(initialBank);
      const [chosenInsurance, setChosenInsurance] = useState(Object.fromEntries(DEFAULT_FAMILIES.map(function(f){return [f.family_id,"Aetna"];})));
      const [ledger, setLedger] = useState([]);

      const [gainVsStart, setGainVsStart] = useState(Object.fromEntries(DEFAULT_FAMILIES.map(function(f){return [f.family_id,0];})));
      const [econPoints, setEconPoints] = useState(Object.fromEntries(DEFAULT_FAMILIES.map(function(f){return [f.family_id,0];})));
      const [happyPoints, setHappyPoints] = useState(Object.fromEntries(DEFAULT_FAMILIES.map(function(f){return [f.family_id,0];})));

      const [currentFamilyIdx, setCurrentFamilyIdx] = useState(0);
      const currentFamily = DEFAULT_FAMILIES[currentFamilyIdx];
      const [submittedMap, setSubmittedMap] = useState(Object.fromEntries(DEFAULT_FAMILIES.map(function(f){return [f.family_id,false];})));
      const [groupIdx, setGroupIdx] = useState(0);
      const [familyIdx, setFamilyIdx] = useState(0);

      const [groupChoiceKey, setGroupChoiceKey] = useState("");
      const [familyChoiceKey, setFamilyChoiceKey] = useState("");

      const [invAction, setInvAction] = useState("");
      const [invName, setInvName] = useState("");
      const [invAmtStr, setInvAmtStr] = useState("");

      const [showLedger, setShowLedger] = useState(false);
      const [showEnd, setShowEnd] = useState(false);
      const [showAdmin, setShowAdmin] = useState(false);
      const [showIntro, setShowIntro] = useState(true);
      const [showExpenses, setShowExpenses] = useState(false);
      const [anim, setAnim] = useState(false);

      const famMap = useMemo(function(){ return Object.fromEntries(DEFAULT_FAMILIES.map(function(f){return [f.family_id,f];})); },[]);
      const isTurn1 = turn === 1;
      const baseGroupEvent = isTurn1 ? INSURANCE_EVENT : GROUP_EVENTS[groupIdx % GROUP_EVENTS.length];
      const groupEvent = baseGroupEvent;
      const familyEventsForSelected = FAMILY_EVENTS_BY_FAMILY[currentFamily.family_id] || [];
      const familyEvent = familyEventsForSelected.length>0 ? familyEventsForSelected[familyIdx % familyEventsForSelected.length] : null;

      /* market */
      const [investmentPrices, setInvestmentPrices] = useState(Object.fromEntries(INVESTMENTS.map(function(x){return [x.name,100];})));
      const [portfolioUnits, setPortfolioUnits] = useState(Object.fromEntries(
        DEFAULT_FAMILIES.map(function(f){
          return [f.family_id, Object.fromEntries(INVESTMENTS.map(function(x){return [x.name,0];}))];
        })
      ));

      function calcHoldingsValue(fid, unitsOverride){
        var units = (unitsOverride || portfolioUnits)[fid] || {};
        var total = 0;
        INVESTMENTS.forEach(function(x){
          var u = units[x.name] || 0;
          var p = investmentPrices[x.name] || 100;
          total += u * p;
        });
        return total;
      }

      function updateMarketPrices(){
        setInvestmentPrices(function(prev){
          var next = Object.assign({}, prev);
          INVESTMENTS.forEach(function(x){
            var p = prev[x.name] || 100;
            var r = 0;
            if(x.name === "IndexFund")      r = randBetween(-0.10, 0.20);
            else if(x.name === "Crypto")    r = randBetween(-0.70, 2.00);
            else if(x.name === "FriendBusiness") r = randBetween(-0.20, 0.40);
            var np = p * (1 + r);
            next[x.name] = Math.max(1, Number(np.toFixed(2)));
          });
          return next;
        });
      }

      function allSubmitted(){ return DEFAULT_FAMILIES.every(function(f){ return submittedMap[f.family_id]; }); }
      function resetSubmitted(){ setSubmittedMap(Object.fromEntries(DEFAULT_FAMILIES.map(function(f){return [f.family_id,false];}))); }
      function goNextFamily(){
        for(var i=1;i<=DEFAULT_FAMILIES.length;i++){
          var idx=(currentFamilyIdx+i)%DEFAULT_FAMILIES.length;
          var f=DEFAULT_FAMILIES[idx];
          if(!submittedMap[f.family_id]){ setCurrentFamilyIdx(idx); return; }
        }
      }

      function dispHappy(h){
        var hd = (typeof h==="number") ? h*10 : 0; /* label shows 10x */
        if(hd > 0) return "+"+hd+" Happy";
        if(hd < 0) return hd+" Happy";
        return "+0 Happy";
      }
      function dispCost(c){
        if(typeof c !== "number" || c === 0) return "-$0";
        return c > 0 ? "-$"+Math.abs(c) : "+$"+Math.abs(c);
      }

      function ChoiceToggles(props){
        var choices = props.choices, selectedKey = props.selectedKey, onSelect = props.onSelect, showMeta = props.showMeta;
        return React.createElement("div",{className:"toggle-group"},
          choices.map(function(c){
            var label = c.key + ". " + c.label;
            if(showMeta){
              label += " (" + dispHappy(c.happy) + ", " + dispCost(c.cost) + ")";
            }
            return React.createElement('span',{
              key:c.key,
              className:'toggle'+(selectedKey===c.key?' active':''),
              onClick:function(){ onSelect(c.key); }
            }, label);
          })
        );
      }

      function submitChoices(){
        var fid = currentFamily.family_id;
        if(submittedMap[fid]){ alert("Already submitted for this family this turn."); return; }

        var fam = famMap[fid];
        var incomeThisTurn = fam.base_income * (sectorMult[fam.sector] || 1);

        var gChoiceObj = null;
        if(groupEvent && groupChoiceKey){
          gChoiceObj = groupEvent.choices.find(function(c){ return c.key === groupChoiceKey; }) || null;
        }
        if(isTurn1){
          if(!gChoiceObj){ alert("Choose a health insurance plan first."); return; }
          var label = gChoiceObj.label;
          var carrierSet = INSURER_MAP[label] || "Aetna";
          var nextIns = Object.assign({}, chosenInsurance);
          nextIns[fid] = carrierSet;
          setChosenInsurance(nextIns);
        }

        var insChoice = chosenInsurance[fid] || "Aetna";
        var carrier = INSURER_MAP[insChoice] || insChoice || "Aetna";
        var monthlyCost = INSURERS[carrier] || 0;

        var gCost = 0, gHappy = 0;
        if(!isTurn1 && gChoiceObj){
          gCost = gChoiceObj.cost || 0;
          gHappy = gChoiceObj.happy || 0;
          if(typeof groupEvent.taxDelta === "number" && taxDeltaRecordedTurn !== turn){
            setPendingTaxDelta(groupEvent.taxDelta);
            setTaxDeltaRecordedTurn(turn);
          }
        }

        var fChoiceObj = null;
        if(familyEvent && familyChoiceKey){
          fChoiceObj = familyEvent.choices.find(function(c){ return c.key === familyChoiceKey; }) || null;
        }
        if(!fChoiceObj){ alert("Choose a family event option."); return; }
        var fCost = fChoiceObj.cost || 0;
        var fHappy = fChoiceObj.happy || 0;

        /* Base expense categories */
        var baseFood = fam.food || 0;
        var baseClothes = fam.clothes || 0;
        var baseMisc = fam.misc || 0;

        /* Tax applies to purchases: food, clothes, misc, plus positive scenario spends */
        var taxable = baseFood + baseClothes + baseMisc + (gCost>0?gCost:0) + (fCost>0?fCost:0);
        var tax = taxable * salesTaxNow;

        /* Investment trade */
        var action = invAction;
        var inv = invName;
        var raw = invAmtStr.trim();
        var amt = raw === "" ? NaN : parseFloat(raw);
        var investNotes = "";
        var investCashFlow = 0;
        var newPortfolioUnits = JSON.parse(JSON.stringify(portfolioUnits));
        if(action === "Buy" || action === "Sell"){
          if(inv === ""){ alert("Pick an investment."); return; }
          if(!(amt > 0)){ alert("Enter a positive dollar amount."); return; }
          var price = investmentPrices[inv] || 100;
          if(action === "Buy"){
            var cash = bank[fid] || 0;
            if(amt > cash + 1e-9){ alert("You cannot invest more than your available cash."); return; }
            var buyUnits = amt / price;
            newPortfolioUnits[fid][inv] = (newPortfolioUnits[fid][inv] || 0) + buyUnits;
            investCashFlow -= amt;
            investNotes = "Bought "+buyUnits.toFixed(4)+" "+inv+" @ "+fmt(price);
          } else {
            var have = newPortfolioUnits[fid][inv] || 0;
            var maxValue = have * price;
            if(amt > maxValue + 1e-8){ alert("You cannot sell more than you hold."); return; }
            var sellUnits = amt / price;
            newPortfolioUnits[fid][inv] = have - sellUnits;
            investCashFlow += amt;
            investNotes = "Sold "+sellUnits.toFixed(4)+" "+inv+" @ "+fmt(price);
          }
        }

        var expenses =
          fam.housing + monthlyCost +
          baseFood + baseClothes + baseMisc +
          fCost + gCost + tax;

        var prevBank = bank[fid]||0;
        var delta = incomeThisTurn - expenses + investCashFlow;
        var newBankVal = prevBank + delta;

        var newBank = Object.assign({}, bank); newBank[fid] = newBankVal;
        setBank(newBank);
        setPortfolioUnits(newPortfolioUnits);

        /* NET WORTH based econ points */
        var newHoldingsValue = calcHoldingsValue(fid, newPortfolioUnits);
        var netWorthNow = newBankVal + newHoldingsValue;
        var startNetWorth = fam.starting_bank; /* initial holdings are zero */
        var gainNow = Math.max(netWorthNow - startNetWorth, 0);
        var gainPrev = gainVsStart[fid] || 0;
        var newGainPeak = Math.max(gainNow, gainPrev);
        var gainDelta = Math.max(newGainPeak - gainPrev, 0);
        var econEarned = (gainDelta * (ROLE_MULT[fam.role] || 1)) / 100;

        var bankDelta = newBankVal - prevBank;
        var happyMoney = bankDelta > 0 ? Math.floor(bankDelta / 500) : 0;
        var happyBase = (gHappy||0) + (fHappy||0) + happyMoney;
        var happyEarned = happyBase * (ROLE_MULT[fam.role] || 1);

        var newGvs = Object.assign({}, gainVsStart); newGvs[fid] = newGainPeak; setGainVsStart(newGvs);
        var newEcon = Object.assign({}, econPoints); newEcon[fid] = (econPoints[fid]||0) + econEarned; setEconPoints(newEcon);
        var newHappy = Object.assign({}, happyPoints); newHappy[fid] = (happyPoints[fid]||0) + happyEarned; setHappyPoints(newHappy);

        var row = {
          turn:turn, role:fam.role, family:fam.name,
          income:Number(incomeThisTurn.toFixed(2)), housing:fam.housing, insurance:monthlyCost,
          group_spend:Number(gCost.toFixed(2)), family_spend:fCost,
          sales_tax_paid:Number(tax.toFixed(2)),
          investments_realized:0, net_change:Number(delta.toFixed(2)), bank_after:Number(newBankVal.toFixed(2)),
          econ_earned:Math.round(econEarned), happy_earned:Math.round(happyEarned),
          econ_total:Math.round(((econPoints[fid]||0)+econEarned)), happy_total:Math.round(((happyPoints[fid]||0)+happyEarned)),
          points_total:Math.round(((econPoints[fid]||0)+econEarned)+((happyPoints[fid]||0)+happyEarned)),
          notes: ("Food "+fmt(baseFood)+", Clothes "+fmt(baseClothes)+", Misc "+fmt(baseMisc)) + (investNotes?(" | "+investNotes):"") + (isTurn1 ? (" | Insurance: " + (INSURER_MAP[gChoiceObj?gChoiceObj.label:""] || (gChoiceObj?gChoiceObj.label:""))) : "")
        };
        setLedger(function(prev){ var copy=prev.slice(); copy.push(row); return copy; });
