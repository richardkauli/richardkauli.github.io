<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Classroom Economy Game</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{
      --fg:#ffffff;
      --green:#22c55e;
      --bg:#000000;
      --greenDim: rgba(34,197,94,.12);
    }
    html, body { height: 100%; background: var(--bg); color: var(--fg); font-family: 'VT323', monospace; }
    .crt-card{ border:2px solid var(--green); border-radius:14px; background: rgba(0,0,0,0.45); }
    .crt-btn{ border:2px solid var(--green); color: var(--fg); background: transparent; padding:.5rem .75rem; border-radius:12px; }
    .crt-btn[disabled]{ opacity:.4; cursor:not-allowed; }
    .crt-btn:hover{ background: var(--greenDim);}
    .number-input::-webkit-outer-spin-button, .number-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .number-input[type=number] { -moz-appearance: textfield; }
    .scroll-table { max-height: 70vh; overflow: auto; }
    .score-total{ font-size: 2.75rem; line-height: 1; }
    .score-sub{ font-size: .95rem; opacity: .95; }
    .label{ font-size: .95rem; opacity:.9; }
    .accent{ color: var(--green); }
    select, input[type=number], input[type=range]{ background: transparent; color: var(--fg); border:2px solid var(--green); border-radius:10px; padding:.25rem .5rem; }
    option{ color:#000; }
    table{ width:100%; }
    th, td{ padding:.5rem; border-bottom:1px solid rgba(255,255,255,0.15); }
    .muted{ color: rgba(255,255,255,.8); }
    .overlay{ position:fixed; inset:0; background:rgba(0,0,0,.9); display:flex; align-items:center; justify-content:center; z-index:50; }
    .panel{ width: min(95vw, 1000px); }
    .pulse{ animation:pulse 1s ease-in-out infinite; }
    @keyframes pulse{ 0%{opacity:.5} 50%{opacity:1} 100%{opacity:.5} }
  </style>
</head>
<body>
  <div id="root" class="min-h-screen"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script>
    const { useState, useMemo } = React;

    const DEFAULT_FAMILIES = [
      { family_id: 1, role: "Serf",   name: "Serfs",   job: "Retail associate", sector: "Retail",    base_income: 5000,  housing: 1500, starting_bank: 3000 },
      { family_id: 2, role: "Knight", name: "Knights", job: "Butcher",          sector: "Food",      base_income: 8500,  housing: 3500, starting_bank: 4000 },
      { family_id: 3, role: "Noble",  name: "Nobles",  job: "Nurse",            sector: "Healthcare",base_income: 15000, housing: 8000, starting_bank: 5000 },
      { family_id: 4, role: "King",   name: "Kings",   job: "Software",         sector: "Tech",      base_income: 26000, housing: 9200, starting_bank: 6000 }
    ];

    // Multipliers and happiness scaling
    const ROLE_MULT = { Serf: 8, Knight: 4, Noble: 4, King: 1 };
    const HAPPY_MULT = 10;

    const SECTORS = ["Retail", "Food", "Healthcare", "Tech"];

    const INSURER_MAP = {
      "Aetna": "Aetna",
      "Coventry": "Aetna",
      "Humana": "Aetna",
      "Cigna": "Anthem",
      "Health Spring": "Anthem",
      "Anthem": "Anthem"
    };
    const INSURERS = { Aetna: 800, Anthem: 850 };

    const GROUP_EVENTS = [
      { id: 1, title: "Sales tax change next turn", description: "Government raises sales tax next turn",
        choices: [
          { key: "A", label: "Increase clothing spend by 200", cost: 200,   happy: 2 },
          { key: "B", label: "No change",                       cost: 0,     happy: 0 },
          { key: "C", label: "Cut clothing by 100",             cost: -100,  happy: -1 }
        ] },
      { id: 2, title: "Fuel price spike", description: "Gas gets expensive across the city",
        choices: [
          { key: "A", label: "Transit and carpool", cost: 50,  happy: 1 },
          { key: "B", label: "Drive as usual",      cost: 200, happy: 0 },
          { key: "C", label: "Buy electric scooter", cost: 400, happy: 1 }
        ] },
      { id: 3, title: "Stimulus checks arrive", description: "Households receive 500 in one time cash",
        choices: [
          { key: "A", label: "Spend it",   cost: -500, happy: 2 },
          { key: "B", label: "Save it",    cost: -500, happy: 1 },
          { key: "C", label: "Invest it",  cost: -500, happy: 1 }
        ] }
    ];

    const FAMILY_EVENTS_BY_FAMILY = {
      1: [
        { id: 101, title: "Daycare for Timmy", description: "Pick care for your toddler", choices: [
          { key: "A", label: "Local daycare class of 40", cost: 800,  happy: 1 },
          { key: "B", label: "Montessori school",        cost: 1000, happy: 2 },
          { key: "C", label: "Family and friends help",  cost: 200,  happy: 0 }
        ]},
        { id: 102, title: "Timmy wants cello", description: "He found a used cello", choices: [
          { key: "A", label: "Lessons plus instrument", cost: 500, happy: 2 },
          { key: "B", label: "Not now",                 cost: 0,   happy: -1 },
          { key: "C", label: "Rent instrument only",    cost: 120, happy: 1 }
        ]}
      ],
      2: [
        { id: 201, title: "Rent increase", description: "Landlord raises rent", choices: [
          { key: "A", label: "Stay and pay higher",     cost: 500,  happy: -1 },
          { key: "B", label: "Move farther, more gas",  cost: 200,  happy: -1 },
          { key: "C", label: "Short term loan",         cost: 2000, happy: -2 }
        ]},
        { id: 202, title: "Teen insurance spike", description: "Accident raises insurance", choices: [
          { key: "A", label: "Bike to school", cost: 100,  happy: 0 },
          { key: "B", label: "Use rideshare",  cost: 350,  happy: 0 },
          { key: "C", label: "Pay the increase", cost: 6000, happy: -2 }
        ]}
      ],
      3: [
        { id: 301, title: "Infant daycare", description: "Two options open up", choices: [
          { key: "A", label: "Local daycare",                 cost: 2900, happy: 1 },
          { key: "B", label: "Private daycare with friends",  cost: 3500, happy: 2 },
          { key: "C", label: "Nanny share part time",         cost: 1800, happy: 1 }
        ]},
        { id: 302, title: "Long commute tradeoff", description: "New hospital role", choices: [
          { key: "A", label: "Transit pass", cost: 129, happy: 0 },
          { key: "B", label: "Decline offer", cost: 0,   happy: 0 },
          { key: "C", label: "Drive and parking", cost: 350, happy: -1 }
        ]}
      ],
      4: [
        { id: 401, title: "Prep school decision", description: "Improve college chances", choices: [
          { key: "A", label: "Send one teen", cost: 1900, happy: 1 },
          { key: "B", label: "Send both",     cost: 3800, happy: 2 },
          { key: "C", label: "Stay public",   cost: 0,    happy: 0 }
        ]},
        { id: 402, title: "College books and fees", description: "First semester bills", choices: [
          { key: "A", label: "All new books",        cost: 600, happy: -1 },
          { key: "B", label: "Used and rentals",     cost: 220, happy: 1 },
          { key: "C", label: "Library and PDFs only", cost: 40,  happy: 0 }
        ]}
      ]
    };

    const INVESTMENTS = [
      { name: "IndexFund", min_amount: 100, expected: 0.02, stdev: 0.01, lock_turns: 1 },
      { name: "CorporateBond", min_amount: 100, expected: 0.01, stdev: 0.003, lock_turns: 1 },
      { name: "Crypto", min_amount: 50, expected: 0.05, stdev: 0.10, lock_turns: 0 },
      { name: "FriendBusiness", min_amount: 200, expected: 0.03, stdev: 0.05, lock_turns: 2 }
    ];

    function fmt(n){ return new Intl.NumberFormat(undefined, { style: "currency", currency: "USD" }).format(n || 0); }
    function randomNormal(mean, stdev){ mean = mean||0; stdev = stdev||1; var u=0,v=0; while(u===0)u=Math.random(); while(v===0)v=Math.random(); var num=Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); return num*stdev+mean; }
    function csvEscape(v){ var s=String(v==null?"":v); if(s.indexOf('"')>-1 || s.indexOf(',')>-1 || s.indexOf('\n')>-1){ return '"' + s.split('"').join('""') + '"'; } return s; }
    function toCSV(rows){ if(!rows||rows.length===0) return ""; var headers=Object.keys(rows[0]); var lines=[headers.join(',')]; for(var i=0;i<rows.length;i++){ var r=rows[i]; lines.push(headers.map(function(h){return csvEscape(r[h]);}).join(',')); } return lines.join("\n"); }

    function App(){
      const [turn, setTurn] = useState(1);
      const [salesTaxNow, setSalesTaxNow] = useState(0.06);
      const [salesTaxNext, setSalesTaxNext] = useState(0.06);
      const [sectorMult, setSectorMult] = useState({ Retail: 1.0, Food: 1.0, Healthcare: 1.0, Tech: 1.0 });

      const initialBank = useMemo(function(){ return Object.fromEntries(DEFAULT_FAMILIES.map(function(f){ return [f.family_id, f.starting_bank]; })); }, []);
      const [bank, setBank] = useState(initialBank);
      const [chosenInsurance, setChosenInsurance] = useState(Object.fromEntries(DEFAULT_FAMILIES.map(function(f){ return [f.family_id, "Aetna"]; })));
      const [ledger, setLedger] = useState([]);
      const [lockedInv, setLockedInv] = useState(Object.fromEntries(DEFAULT_FAMILIES.map(function(f){ return [f.family_id, []]; })));

      const [gainVsStart, setGainVsStart] = useState(Object.fromEntries(DEFAULT_FAMILIES.map(function(f){ return [f.family_id, 0]; })));
      const [econPoints, setEconPoints] = useState(Object.fromEntries(DEFAULT_FAMILIES.map(function(f){ return [f.family_id, 0]; })));
      const [happyPoints, setHappyPoints] = useState(Object.fromEntries(DEFAULT_FAMILIES.map(function(f){ return [f.family_id, 0]; })));

      const [currentFamilyIdx, setCurrentFamilyIdx] = useState(0);
      const currentFamily = DEFAULT_FAMILIES[currentFamilyIdx];
      const [submittedMap, setSubmittedMap] = useState(Object.fromEntries(DEFAULT_FAMILIES.map(function(f){ return [f.family_id, false]; })));

      const [groupIdx, setGroupIdx] = useState(0);
      const [familyIdx, setFamilyIdx] = useState(0);

      const [groupChoiceKey, setGroupChoiceKey] = useState("B");
      const [familyChoiceKey, setFamilyChoiceKey] = useState("B");
      const [invName, setInvName] = useState("None");
      const [invAmt, setInvAmt] = useState(0);

      const [showLedger, setShowLedger] = useState(false);
      const [showEnd, setShowEnd] = useState(false);
      const [showAdmin, setShowAdmin] = useState(false);
      const [showIntro, setShowIntro] = useState(true);
      const [anim, setAnim] = useState(false);

      const famMap = useMemo(function(){ return Object.fromEntries(DEFAULT_FAMILIES.map(function(f){ return [f.family_id, f]; })); }, []);
      const groupEvent = GROUP_EVENTS[groupIdx % GROUP_EVENTS.length];
      const familyEventsForSelected = FAMILY_EVENTS_BY_FAMILY[currentFamily.family_id] || [];
      const familyEvent = familyEventsForSelected.length>0 ? familyEventsForSelected[familyIdx % familyEventsForSelected.length] : null;

      function allSubmitted(){ return DEFAULT_FAMILIES.every(function(f){ return submittedMap[f.family_id]; }); }
      function resetSubmitted(){ setSubmittedMap(Object.fromEntries(DEFAULT_FAMILIES.map(function(f){ return [f.family_id, false]; }))); }
      function goNextFamily(){
        for(var i=1;i<=DEFAULT_FAMILIES.length;i++){
          var idx=(currentFamilyIdx+i)%DEFAULT_FAMILIES.length;
          var f=DEFAULT_FAMILIES[idx];
          if(!submittedMap[f.family_id]){ setCurrentFamilyIdx(idx); return; }
        }
      }

      function submitChoices(){
        var fid = currentFamily.family_id;
        if(submittedMap[fid]){ alert("Already submitted for this family this turn."); return; }

        var fam = famMap[fid];
        var incomeThisTurn = fam.base_income * (sectorMult[fam.sector] || 1);
        var insChoice = chosenInsurance[fid] || "Aetna";
        var carrier = INSURER_MAP[insChoice] || "Aetna";
        var monthlyCost = INSURERS[carrier] || 0;

        var gChoice = (groupEvent.choices.find(function(c){return c.key===groupChoiceKey;}) || {cost:0, happy:0});
        var fChoice = familyEvent ? (familyEvent.choices.find(function(c){return c.key===familyChoiceKey;}) || {cost:0, happy:0}) : {cost:0, happy:0};

        var taxable = Math.max(gChoice.cost,0);
        var tax = taxable * salesTaxNow;

        var realized = 0; var remaining=[];
        for(var j=0;j<lockedInv[fid].length;j++){
          var inv = lockedInv[fid][j];
          if(turn - inv.turn_bought >= inv.lock_turns){
            var rnd = randomNormal(inv.expected, inv.stdev);
            realized += inv.amount * (1 + rnd);
          } else { remaining.push(inv); }
        }

        var notes=""; var gCostPlusInv=gChoice.cost;
        if(invName && invName!=="None" && invAmt>0){
          var spec = INVESTMENTS.find(function(x){return x.name===invName;});
          if(spec){
            if(invAmt >= spec.min_amount){
              remaining.push({turn_bought:turn, investment:invName, amount:invAmt, expected:spec.expected, stdev:spec.stdev, lock_turns:spec.lock_turns});
              notes = "Invested " + fmt(invAmt) + " in " + invName;
              gCostPlusInv += invAmt;
            } else { notes = "Skipped, min for " + invName + " is " + fmt(spec.min_amount); }
          }
        }

        var expenses = fam.housing + monthlyCost + fChoice.cost + gCostPlusInv + tax;
        var prevBank = bank[fid]||0;
        var delta = incomeThisTurn - expenses + realized;
        var newBankVal = prevBank + delta;
        var newBank = Object.assign({}, bank); newBank[fid] = newBankVal;

        // Econ points: 100x smaller, then role multiplier
        var gainNow = Math.max(newBankVal - fam.starting_bank, 0);
        var gainPrev = gainVsStart[fid] || 0;
        var newGainPeak = Math.max(gainNow, gainPrev);
        var gainDelta = Math.max(newGainPeak - gainPrev, 0);
        var econEarned = (gainDelta * (ROLE_MULT[fam.role] || 1)) / 100;

        // Happiness: choices plus a money bump
        var bankDelta = newBankVal - prevBank;
        var happyMoney = bankDelta > 0 ? Math.floor(bankDelta / 500) : 0;
        var happyEarned = HAPPY_MULT * ((gChoice.happy||0) + (fChoice.happy||0) + happyMoney);

        setBank(newBank);
        var newLocked = Object.assign({}, lockedInv); newLocked[fid] = remaining; setLockedInv(newLocked);
        var newGvs = Object.assign({}, gainVsStart); newGvs[fid] = newGainPeak; setGainVsStart(newGvs);
        var newEcon = Object.assign({}, econPoints); newEcon[fid] = (econPoints[fid]||0) + econEarned; setEconPoints(newEcon);
        var newHappy = Object.assign({}, happyPoints); newHappy[fid] = (happyPoints[fid]||0) + happyEarned; setHappyPoints(newHappy);

        var row = {
          turn: turn, family_id: fid, role: fam.role, family: fam.name,
          income: Number(incomeThisTurn.toFixed(2)), housing: fam.housing, insurance: monthlyCost,
          group_spend: Number(gCostPlusInv.toFixed(2)), family_spend: fChoice.cost, sales_tax_paid: Number(tax.toFixed(2)),
          investments_realized: Number(realized.toFixed(2)), net_change: Number(delta.toFixed(2)), bank_after: Number(newBankVal.toFixed(2)),
          points_econ_earned: Math.round(econEarned), points_happy_earned: Math.round(happyEarned),
          points_econ_total: Math.round((econPoints[fid]||0)+econEarned), points_happy_total: Math.round((happyPoints[fid]||0)+happyEarned),
          points_total: Math.round((econPoints[fid]||0)+econEarned+(happyPoints[fid]||0)+happyEarned),
          notes: (notes ? notes + "  " : "") + (happyMoney ? "Money happiness +" + happyMoney : "")
        };
        setLedger(function(prev){ var copy = prev.slice(); copy.push(row); return copy; });

        var nextMap = Object.assign({}, submittedMap); nextMap[fid] = true; setSubmittedMap(nextMap);
        setGroupChoiceKey("B"); setFamilyChoiceKey("B"); setInvName("None"); setInvAmt(0);
        goNextFamily();
      }

      function animateToNextTurn(){ setAnim(true); setTimeout(function(){ setAnim(false); }, 1000); }

      function advanceTurn(){
        if(!allSubmitted()) return;
        setTurn(function(p){ return p+1; });
        setSalesTaxNow(salesTaxNext);
        setGroupIdx(function(p){ return p+1; });
        setFamilyIdx(function(p){ return p+1; });
        resetSubmitted();
        setCurrentFamilyIdx(0);
        setGroupChoiceKey("B"); setFamilyChoiceKey("B"); setInvName("None"); setInvAmt(0);
        animateToNextTurn();
      }

      function skipTurn(){
        setTurn(function(p){ return p+1; });
        setSalesTaxNow(salesTaxNext);
        setGroupIdx(function(p){ return p+1; });
        setFamilyIdx(function(p){ return p+1; });
        resetSubmitted();
        setCurrentFamilyIdx(0);
        setGroupChoiceKey("B"); setFamilyChoiceKey("B"); setInvName("None"); setInvAmt(0);
        animateToNextTurn();
      }

      function restartGame(){
        setTurn(1);
        setSalesTaxNow(0.06); setSalesTaxNext(0.06);
        setSectorMult({ Retail:1.0, Food:1.0, Healthcare:1.0, Tech:1.0 });
        setBank(Object.fromEntries(DEFAULT_FAMILIES.map(function(f){ return [f.family_id,f.starting_bank]; })));
        setChosenInsurance(Object.fromEntries(DEFAULT_FAMILIES.map(function(f){ return [f.family_id,"Aetna"]; })));
        setLockedInv(Object.fromEntries(DEFAULT_FAMILIES.map(function(f){ return [f.family_id,[]]; })));
        setLedger([]);
        setGainVsStart(Object.fromEntries(DEFAULT_FAMILIES.map(function(f){ return [f.family_id,0]; })));
        setEconPoints(Object.fromEntries(DEFAULT_FAMILIES.map(function(f){ return [f.family_id,0]; })));
        setHappyPoints(Object.fromEntries(DEFAULT_FAMILIES.map(function(f){ return [f.family_id,0]; })));
        setGroupIdx(0); setFamilyIdx(0);
        setCurrentFamilyIdx(0); resetSubmitted();
        setGroupChoiceKey("B"); setFamilyChoiceKey("B"); setInvName("None"); setInvAmt(0);
        setShowEnd(false); setShowLedger(false); setShowAdmin(false); setShowIntro(true);
      }

      const perFamilyScores = DEFAULT_FAMILIES.map(function(f){
        var fid = f.family_id;
        var econ = Math.round(econPoints[fid] || 0);
        var happy = Math.round(happyPoints[fid] || 0);
        var total = econ + happy;
        return { fid: fid, name: f.name, role: f.role, econ: econ, happy: happy, total: total };
      });

      var fam = currentFamily;
      var incomeThisTurn = fam.base_income * (sectorMult[fam.sector] || 1);
      var remainingCount = DEFAULT_FAMILIES.filter(function(f){ return !submittedMap[f.family_id]; }).length;

      function labelCell(txt){ return React.createElement("div", { className: "muted" }, txt); }
      function accentCell(txt){ return React.createElement("div", { className: "accent" }, txt); }

      return React.createElement(React.Fragment, null,

        /* INTRO OVERLAY */
        showIntro ? React.createElement("div", { className: "overlay", onClick: function(){ setShowIntro(false); } },
          React.createElement("div", { className: "crt-card p-6 panel space-y-4 text-center" },
            React.createElement("div", { className: "text-3xl accent" }, "We live in a society with tradeoffs"),
            React.createElement("p", { className: "muted" },
              "Prices move. Taxes change. Families choose. Your goal is simple. Grow wealth and keep people happy."
            ),
            React.createElement("div", { className: "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3 text-left" },
              DEFAULT_FAMILIES.map(function(f){
                return React.createElement("div", { key: f.family_id, className: "crt-card p-4" },
                  React.createElement("div", { className: "text-xl" }, f.name + " (" + f.role + ")"),
                  React.createElement("div", { className: "mt-1" }, labelCell("Job")),
                  React.createElement("div", { className: "accent" }, f.job),
                  React.createElement("div", { className: "mt-1" }, labelCell("Income")),
                  React.createElement("div", { className: "accent" }, fmt(f.base_income)),
                  React.createElement("div", { className: "mt-1" }, labelCell("Housing")),
                  React.createElement("div", { className: "accent" }, fmt(f.housing)),
                  React.createElement("div", { className: "mt-1" }, labelCell("Role multiplier")),
                  React.createElement("div", { className: "accent" }, "x" + ROLE_MULT[f.role])
                );
              })
            ),
            React.createElement("div", { className: "crt-card p-4 text-left space-y-1" },
              React.createElement("div", null, React.createElement("span", { className: "accent" }, "How to score")),
              React.createElement("div", null, "Economic points come from growing your bank above the start."),
              React.createElement("div", null, "Your role multiplier boosts economic points."),
              React.createElement("div", null, "Happiness comes from choices and money growth."),
              React.createElement("div", null, "Happiness is scaled by " + HAPPY_MULT + ".")
            ),
            React.createElement("div", { className: "muted pt-2" }, "Click anywhere to start")
          )
        ) : null,

        React.createElement("div", { className: "max-w-7xl mx-auto p-4 md:p-6 space-y-4" },

          /* SCOREBOARD */
          React.createElement("div", { className: "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3" },
            perFamilyScores.map(function(s){
              return React.createElement("div", { key: s.fid, className: "crt-card p-4" },
                React.createElement("div", { className: "text-xl" }, s.name),
                React.createElement("div", { className: "score-total font-bold mt-2 accent" }, s.total),
                React.createElement("div", { className: "mt-2 grid grid-cols-2 gap-2" },
                  React.createElement("div", { className: "crt-card p-2 text-center" },
                    labelCell("Economic"),
                    React.createElement("div", { className: "score-sub accent font-bold" }, s.econ)
                  ),
                  React.createElement("div", { className: "crt-card p-2 text-center" },
                    labelCell("Happiness"),
                    React.createElement("div", { className: "score-sub accent font-bold" }, s.happy)
                  )
                )
              );
            })
          ),

          /* CONTROL BAR */
          React.createElement("div", { className: "flex gap-2" },
            React.createElement("button", { className: "crt-btn", onClick: function(){ setShowLedger(true); } }, "View ledger"),
            React.createElement("button", { className: "crt-btn", onClick: function(){ setShowAdmin(true); } }, "Admin"),
            React.createElement("button", { className: "crt-btn", onClick: function(){ setShowEnd(true); } }, "End game"),
            React.createElement("div", { className: "ml-auto flex gap-2" },
              React.createElement("button", { className: "crt-btn", onClick: skipTurn }, "Skip turn"),
              React.createElement("button", { className: "crt-btn", disabled: !allSubmitted(), onClick: advanceTurn },
                "Advance turn" + (!allSubmitted() ? " (" + remainingCount + " left)" : "")
              )
            )
          ),

          /* MAIN FLOW */
          React.createElement("main", { className: "flex-1 space-y-4" },
            React.createElement("div", { className: "crt-card p-4" },
              React.createElement("div", { className: "flex items-center justify-between" },
                React.createElement("div", null,
                  React.createElement("div", { className: "text-2xl" }, fam.name + " (" + fam.role + ")"),
                  React.createElement("div", { className: "muted" }, "Sector " + fam.sector + "  Income this turn " + fmt(incomeThisTurn))
                ),
                React.createElement("div", { className: "text-right" },
                  labelCell("Bank"),
                  React.createElement("div", { className: "text-2xl accent" }, fmt(bank[fam.family_id]))
                )
              ),
              React.createElement("div", { className: "mt-3 grid grid-cols-1 md:grid-cols-3 gap-4" },
                React.createElement("div", { className: "p-3 crt-card" },
                  labelCell("Housing"),
                  React.createElement("div", { className: "text-2xl accent" }, fmt(fam.housing))
                ),
                React.createElement("div", { className: "p-3 crt-card" },
                  labelCell("Role multiplier"),
                  React.createElement("div", { className: "text-2xl accent" }, "x" + ROLE_MULT[fam.role])
                ),
                React.createElement("div", { className: "p-3 crt-card" },
                  labelCell("Insurance"),
                  (function(){ var carrier = INSURER_MAP[chosenInsurance[fam.family_id] || "Aetna"] || "Aetna"; var monthly = INSURERS[carrier] || 0; return accentCell("Coverage " + carrier + "  Monthly " + fmt(monthly)); })()
                )
              )
            ),

            React.createElement("div", { className: "grid grid-cols-1 lg:grid-cols-3 gap-4" },
              React.createElement("section", { className: "crt-card p-4" },
                React.createElement("h3", { className: "text-xl mb-2" }, "Health insurance"),
                React.createElement("label", { className: "label" }, "Your choice"),
                React.createElement("select", { value: (chosenInsurance[fam.family_id] || "Aetna"), onChange: function(e){ var o={}; for(var k in chosenInsurance) o[k]=chosenInsurance[k]; o[fam.family_id]=e.target.value; setChosenInsurance(o);} },
                  Object.keys(INSURER_MAP).map(function(k){ return React.createElement("option", { key: k, value: k }, k); })
                )
              ),

              React.createElement("section", { className: "crt-card p-4" },
                React.createElement("h3", { className: "text-xl" }, "Group scenario"),
                React.createElement("div", null, groupEvent.title + ". " + groupEvent.description),
                React.createElement("div", { className: "mt-2 space-y-2" },
                  groupEvent.choices.map(function(c){
                    return React.createElement("label", { key: c.key, className: "flex items-center gap-2" },
                      React.createElement("input", { type: "radio", name: "groupChoice", checked: groupChoiceKey === c.key, onChange: function(){ setGroupChoiceKey(c.key); } }),
                      React.createElement("span", null, c.key + ". " + c.label + " ("),
                      React.createElement("span", { className: "accent" }, fmt(c.cost)),
                      React.createElement("span", null, "  happy " + (c.happy>=0?"+":"") + c.happy + ")")
                    );
                  })
                )
              ),

              React.createElement("section", { className: "crt-card p-4" },
                React.createElement("h3", { className: "text-xl" }, "Family event"),
                familyEvent
                  ? React.createElement(React.Fragment, null,
                      React.createElement("div", null, familyEvent.title + ". " + familyEvent.description),
                      React.createElement("div", { className: "mt-2 space-y-2" },
                        familyEvent.choices.map(function(c){
                          return React.createElement("label", { key: c.key, className: "flex items-center gap-2" },
                            React.createElement("input", { type: "radio", name: "familyChoice", checked: familyChoiceKey === c.key, onChange: function(){ setFamilyChoiceKey(c.key); } }),
                            React.createElement("span", null, c.key + ". " + c.label + " ("),
                            React.createElement("span", { className: "accent" }, fmt(c.cost)),
                            React.createElement("span", null, "  happy " + (c.happy>=0?"+":"") + c.happy + ")")
                          );
                        })
                      )
                    )
                  : React.createElement("div", { className: "muted" }, "No events configured for this family.")
              )
            ),

            /* INVESTMENTS + SUBMIT OR ADVANCE */
            React.createElement("div", { className: "crt-card p-4" },
              React.createElement("h3", { className: "text-xl mb-2" }, "Investments"),
              React.createElement("div", { className: "grid grid-cols-1 md:grid-cols-3 gap-3" },
                React.createElement("div", null,
                  React.createElement("label", { className: "label" }, "Option"),
                  React.createElement("select", { value: invName, onChange: function(e){ setInvName(e.target.value); } },
                    React.createElement("option", { value: "None" }, "None"),
                    INVESTMENTS.map(function(x){ return React.createElement("option", { key: x.name, value: x.name }, x.name + " (min " + fmt(x.min_amount) + ")"); })
                  )
                ),
                React.createElement("div", null,
                  React.createElement("label", { className: "label" }, "Amount"),
                  React.createElement("input", { type: "number", className: "number-input w-full", min: 0, step: 50, value: invAmt, onChange: function(e){ setInvAmt(Number(e.target.value)); } })
                ),
                React.createElement("div", { className: "flex items-end" },
                  allSubmitted()
                    ? React.createElement("button", { onClick: advanceTurn, className: "crt-btn" }, "Advance turn")
                    : (submittedMap[fam.family_id]
                        ? React.createElement("button", { className: "crt-btn", disabled: true }, "Submitted")
                        : React.createElement("button", { onClick: submitChoices, className: "crt-btn" }, "Submit choices for this family")
                      )
                )
              )
            )
          )
        ),

        /* LEDGER MODAL */
        showLedger ? React.createElement("div", { className: "overlay" },
          React.createElement("div", { className: "crt-card p-4 panel" },
            React.createElement("div", { className: "flex items-center justify-between mb-2" },
              React.createElement("h3", { className: "text-xl" }, "Ledger"),
              React.createElement("div", { className: "flex gap-2" },
                React.createElement("button", { className: "crt-btn", onClick: function(){
                  var csv = toCSV(ledger);
                  var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
                  var url = URL.createObjectURL(blob); var a=document.createElement('a'); a.href=url; a.download='ledger.csv'; a.click(); URL.revokeObjectURL(url);
                } }, "Download CSV"),
                React.createElement("button", { className: "crt-btn", onClick: function(){ setShowLedger(false); } }, "Close")
              )
            ),
            ledger.length===0 ? React.createElement("div", { className: "muted" }, "No entries yet.") :
            React.createElement("div", { className: "scroll-table" },
              React.createElement("table", null,
                React.createElement("thead", null,
                  React.createElement("tr", null,
                    ["turn","role","family","income","housing","insurance","group_spend","family_spend","sales_tax_paid","investments_realized","net_change","bank_after","econ_earned","happy_earned","econ_total","happy_total","points_total","notes"].map(function(h){
                      return React.createElement("th", { key:h }, h.split('_').join(' '));
                    })
                  )
                ),
                React.createElement("tbody", null,
                  ledger.slice().reverse().map(function(row,idx){
                    return React.createElement("tr", { key:idx },
                      React.createElement("td", null, row.turn),
                      React.createElement("td", null, row.role),
                      React.createElement("td", null, row.family),
                      React.createElement("td", null, fmt(row.income)),
                      React.createElement("td", null, fmt(row.housing)),
                      React.createElement("td", null, fmt(row.insurance)),
                      React.createElement("td", null, fmt(row.group_spend)),
                      React.createElement("td", null, fmt(row.family_spend)),
                      React.createElement("td", null, fmt(row.sales_tax_paid)),
                      React.createElement("td", null, fmt(row.investments_realized)),
                      React.createElement("td", null, fmt(row.net_change)),
                      React.createElement("td", null, fmt(row.bank_after)),
                      React.createElement("td", null, Math.round(row.points_econ_earned)),
                      React.createElement("td", null, Math.round(row.points_happy_earned)),
                      React.createElement("td", null, Math.round(row.points_econ_total)),
                      React.createElement("td", null, Math.round(row.points_happy_total)),
                      React.createElement("td", null, Math.round(row.points_total)),
                      React.createElement("td", null, row.notes)
                    );
                  })
                )
              )
            )
          )
        ) : null,

        /* END SCREEN */
        showEnd ? React.createElement("div", { className: "overlay" },
          React.createElement("div", { className: "crt-card p-6 panel space-y-4" },
            React.createElement("h2", { className: "text-3xl text-center" }, "Final Scores"),
            React.createElement("div", { className: "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3" },
              perFamilyScores.map(function(s){
                return React.createElement("div", { key: s.fid, className: "crt-card p-4 text-center" },
                  React.createElement("div", { className: "muted" }, s.name + " (" + s.role + ")"),
                  React.createElement("div", { className: "score-total font-bold mt-2 accent" }, s.total),
                  React.createElement("div", { className: "mt-2 grid grid-cols-2 gap-2" },
                    React.createElement("div", { className: "crt-card p-2" },
                      React.createElement("div", { className: "muted" }, "Economic"),
                      React.createElement("div", { className: "score-sub accent font-bold" }, s.econ)
                    ),
                    React.createElement("div", { className: "crt-card p-2" },
                      React.createElement("div", { className: "muted" }, "Happiness"),
                      React.createElement("div", { className: "score-sub accent font-bold" }, s.happy)
                    )
                  )
                );
              })
            ),
            React.createElement("div", { className: "crt-card p-4" },
              React.createElement("table", { className: "w-full" },
                React.createElement("thead", null,
                  React.createElement("tr", null,
                    ["Family","Role","Start $","End $"].map(function(h){ return React.createElement("th", { key:h }, h); })
                  )
                ),
                React.createElement("tbody", null,
                  DEFAULT_FAMILIES.map(function(f){
                    return React.createElement("tr", { key:f.family_id },
                      React.createElement("td", null, f.name),
                      React.createElement("td", null, f.role),
                      React.createElement("td", null, fmt(f.starting_bank)),
                      React.createElement("td", null, fmt(bank[f.family_id]))
                    );
                  })
                )
              )
            ),
            React.createElement("div", { className: "flex justify-end gap-2" },
              React.createElement("button", { className: "crt-btn", onClick: restartGame }, "Restart")
            )
          )
        ) : null,

        /* TURN ANIMATION */
        anim ? React.createElement("div", { className: "overlay" },
          React.createElement("div", { className: "text-4xl pulse" }, "Advancing to Turn " + turn)
        ) : null
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(React.createElement(App));
  </script>
</body>
</html>
