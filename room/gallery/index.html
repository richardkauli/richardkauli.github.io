<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Room Workshop Render</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ink:#1b1b1a; --muted:#77736c; --ground:#f4f3f0; --panel:rgba(250,249,247,.88);
  --line:rgba(27,27,26,.14); --accent:#b07a3f;
  --display:"Archivo Narrow","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
html,body{margin:0;padding:0;height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--mono);overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.panel{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px);max-height:calc(100% - 32px);overflow:auto;box-sizing:border-box;
  background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.panel h1{margin:0;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.04em;text-transform:uppercase}
.row{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.row span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);width:64px}
.row button{font-family:var(--mono);font-size:11px;color:var(--ink);background:transparent;border:1px solid var(--line);padding:5px 8px;cursor:pointer}
.row button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.row button:focus-visible{outline:1px solid var(--accent);outline-offset:2px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ph button{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:transparent;border:1px solid var(--line);padding:4px 8px;cursor:pointer}
.ph button:focus-visible{outline:1px solid var(--accent);outline-offset:2px}
.panel.min{padding:8px 10px}.panel.min>*:not(.ph){display:none}.panel.min h1{font-size:13px}
.shot .panel{display:none}
@media (max-width:560px){.row span{width:100%}}
</style>
</head>
<body>
<canvas id="c" aria-label="3D render of the room as a plywood workshop with a platform bed"></canvas>
<div class="panel" id="panel"><div class="ph"><h1>A · Platform workshop</h1><button type="button" id="hidebtn" aria-expanded="true">Hide</button></div></div>
<script>
(() => { const p = document.getElementById('panel'), b = document.getElementById('hidebtn');
  const set = min => { p.classList.toggle('min', min); b.textContent = min ? 'Show options' : 'Hide'; b.setAttribute('aria-expanded', String(!min)); try { localStorage.setItem('roomPanelMin', min ? '1' : ''); } catch (e) {} };
  let start = false; try { start = localStorage.getItem('roomPanelMin') === '1'; } catch (e) {}
  set(start); b.addEventListener('click', () => { set(!p.classList.contains('min')); b.blur(); }); })();
</script>

const pick = (keys, def) => keys.find(k => params.includes(k)) || def;
const state = {
  view: pick(Object.keys(VIEWS), 'overview'), stain: 'honey', screen: pick(['up', 'down', 'sweep'], 'noscreen').replace('noscreen', 'none'),
  singer: params.includes('singerdesk') ? 'desk' : 'table', closet: pick(['open', 'white', 'rust', 'olive'], 'doors'), wall: pick(['photos', 'mirror', 'print', 'vision'], 'none'), above: pick(['shelf', 'frames', 'pegs', 'noabove'], 'print').replace('noabove', 'none'),
  legs: 'ends', table: pick(['big', 'work', 'fold', 'foldwall', 'none', 'dinner'], 'nook'), hallcloset: params.includes('hallopen') ? 'open' : 'closed', shelflights: params.includes('shelfall') ? 'all' : 'bottom',
  time: params.includes('evening') ? 'evening' : 'day' };
const CHOICES = {
  closet: { open: 'Open', doors: 'Doors', white: 'White curtain', rust: 'Rust curtain', olive: 'Olive curtain' },

  hallcloset: { closed: 'Closed', open: 'Open' },
  shelflights: { bottom: 'Bottom shelf', all: 'All shelves' },
  table: { big: '4×8 table', work: 'Tall work table', fold: 'Foldout', foldwall: 'Foldout, folded on wall', nook: 'Foldout, folded in hall nook', dinner: 'Dinner for 4', none: 'No table' },
  screen: { none: 'None', up: 'Rolled up', down: 'Down (projector)', sweep: 'Rolled out (photo sweep)' },
  wall: { none: 'Nothing', vision: 'Vision board', print: 'One print', photos: 'Photo wall', mirror: 'Mirror' },
  above: { none: 'Nothing', print: 'One print', frames: 'Three frames', shelf: 'Floating shelf', pegs: 'Peg rail' }, time: { day: 'Daytime', evening: 'Evening' } };

function apply() {
  if (state.screen === 'sweep') state.table = 'none';   // shoot day: table out of the way
  for (const [name, opts] of Object.entries(toggles)) for (const [k, g] of Object.entries(opts)) g.visible = state[name] === k;

function setView(k) { if (walk && walk.on) setWalk(false); state.view = k; const v = VIEWS[k]; camera.position.set(...v.p); controls.target.set(...v.t); camera.fov = v.fov; camera.updateProjectionMatrix(); controls.update(); apply(); }
const panel = document.getElementById('panel');
for (const [g, opts] of Object.entries(CHOICES)) { const row = document.createElement('div'); row.className = 'row'; row.innerHTML = `<span>${LABEL[g]}</span>`; panel.appendChild(row);
  for (const [k, n] of Object.entries(opts)) { const b = document.createElement('button'); b.type = 'button'; b.dataset.g = g; b.dataset.k = k; b.textContent = n;
    b.addEventListener('click', () => { if (g === 'view') setView(k); else { state[g] = k; apply(); } }); row.appendChild(b); } }
setView(state.view);

// walkable areas: main room, kitchen doorway + aisle, entry; desk, bed platform and the middle table block
const WALKABLE = [[0.6, 18.5, 0.6, 11.5], [2.0, 4.5, 11, 13], [2.0, 4.2, 12.5, 24.0], [0.5, 4.2, 17.45, 19.7], [-0.6, 0.6, 18.75, 19.7], [-3.3, -0.45, 10.5, 20.0], [18, 22.4, 8.8, 11.6], [9.7, 12.0, 11, 18.4]];   // incl. kitchen -> balcony door -> balcony
const TABLE_BLOCK = { big: [2.5, 11.3, 4.6, 9.4], work: [3.6, 10.4, 5.0, 8.8], fold: [3.8, 10.4, 5.1, 8.9], foldwall: [5.4, 8.8, 10.6, 12.1], nook: null, dinner: [4.2, 9.8, 3.8, 9.4], none: null };
function walkOK(x, z) { const inR = ([a, b, c, d]) => x > a && x < b && z > c && z < d;
  return WALKABLE.some(inR) && !inR([0.6, 12.6, -1, 2.7]) && !(TABLE_BLOCK[state.table] && inR(TABLE_BLOCK[state.table])) && !(state.singer === 'table' && inR([4.7, 9.4, 9.9, 12.1])); }
const WALK_START = [16.6, 9.8, Math.PI / 2 - 0.35];
function groundAt(x, z) { const r = .3;   // bed platform 18", mattress on top ~27"
  if (x > 13.95 - r && x < 18.9 + r && z > .15 - r && z < 6.82 + r) return 2.25;
  if (x > 12.55 - r && x < 19 && z > -1 && z < 7.6 + r) return 1.5; return 0; }
// ---------- walk mode: WASD / arrows to move, drag to look, Shift to run (needs walkOK(x, z) + WALK_START) ----------
var walk = { on: false, yaw: 0, pitch: 0, keys: new Set(), drag: null, eye: 5.4, y: 0, vy: 0 };   // Space jumps, C crouches
const EYE = 5.4, MOVEKEYS = ['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'];
function setWalk(on) {
  walk.on = on; controls.enabled = !on; walk.keys.clear(); const d = new THREE.Vector3(); camera.getWorldDirection(d);
  if (on) { walk.yaw = Math.atan2(-d.x, -d.z); walk.pitch = 0; let x = camera.position.x, z = camera.position.z;
    if (camera.position.y > H - .3 || !walkOK(x, z)) [x, z, walk.yaw] = WALK_START;
    walk.eye = EYE; walk.y = groundAt(x, z); walk.vy = 0; walk.grounded = true; camera.position.set(x, EYE, z); camera.fov = 70; camera.updateProjectionMatrix(); }
  else { controls.target.copy(camera.position).addScaledVector(d, 4); controls.update(); }

  dirty();
}
addEventListener('keydown', e => { if (e.metaKey || e.ctrlKey || e.altKey) return; const k = e.key.toLowerCase();
  if (k === 'shift') walk.keys.add(k);
  if (walk.on && k === ' ') { e.preventDefault(); if (walk.grounded) { walk.vy = 11; walk.grounded = false; } }
  if (walk.on && k === 'c') walk.keys.add('c');
  if (MOVEKEYS.includes(k)) { e.preventDefault(); if (!walk.on) setWalk(true); walk.keys.add(k); } });
addEventListener('keyup', e => walk.keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => walk.keys.clear());
canvas.addEventListener('pointerdown', e => { if (!walk.on) return; walk.drag = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => { if (!walk.on || !walk.drag) return;
  walk.yaw -= (e.clientX - walk.drag.x) * 0.004; walk.pitch = Math.max(-1.2, Math.min(1.2, walk.pitch - (e.clientY - walk.drag.y) * 0.004)); walk.drag = { x: e.clientX, y: e.clientY }; dirty(); });
const endDrag = () => walk.drag = null; canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('wheel', e => { if (!walk.on) return; e.preventDefault(); camera.fov = Math.max(35, Math.min(95, camera.fov * Math.exp(e.deltaY * 0.001))); camera.updateProjectionMatrix(); dirty(); }, { passive: false });
function walkStep(dt) { const k = walk.keys, crouch = k.has('shift') || k.has('c'), sp = (crouch ? 3.2 : 6.5) * dt; let moved = false;   // Shift (or C) crouches
  const eye0 = walk.eye; walk.eye += ((crouch ? 3.0 : EYE) - walk.eye) * Math.min(1, dt * 12); if (Math.abs(walk.eye - eye0) > 1e-4) moved = true;   // crouch: eye drops to 3 ft
  const gnd = groundAt(camera.position.x, camera.position.z);   // feet height: floor, bed platform or mattress
  if (walk.y > gnd || walk.vy > 0) { walk.vy -= 32 * dt; walk.y += walk.vy * dt; walk.grounded = false; if (walk.y <= gnd) { walk.y = gnd; walk.vy = 0; walk.grounded = true; } moved = true; }   // jump: ~1.9 ft up
  else { walk.y = gnd; walk.grounded = true; }
  camera.position.y = Math.min(H - .25, walk.eye + walk.y);
  const f = (k.has('w') || k.has('arrowup') ? 1 : 0) - (k.has('s') || k.has('arrowdown') ? 1 : 0), st = (k.has('d') || k.has('arrowright') ? 1 : 0) - (k.has('a') || k.has('arrowleft') ? 1 : 0);
  if (!f && !st) return moved;
  const fx = -Math.sin(walk.yaw), fz = -Math.cos(walk.yaw), rx = Math.cos(walk.yaw), rz = -Math.sin(walk.yaw), dx = (fx * f + rx * st) * sp, dz = (fz * f + rz * st) * sp, p = camera.position;
  const can = (x, z) => walkOK(x, z) && groundAt(x, z) <= walk.y + 0.6;   // step up 7" without jumping, more needs a jump

{ const row = document.createElement('div'); row.className = 'row'; row.innerHTML = '<span>Mode</span>';
  for (const [m, n] of [['orbit', 'Orbit'], ['walk', 'Walk: WASD · Space jump · Shift crouch']]) { const b = document.createElement('button'); b.type = 'button'; b.dataset.mode = m; b.textContent = n; b.setAttribute('aria-pressed', m === 'orbit'); b.addEventListener('click', () => { setWalk(m === 'walk'); b.blur(); }); row.appendChild(b); }
