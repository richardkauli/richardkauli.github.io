<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Desk Wall Units</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ink:#1b1b1a; --muted:#77736c; --ground:#f4f3f0; --panel:rgba(250,249,247,.88);
  --line:rgba(27,27,26,.14); --accent:#b07a3f;
  --display:"Archivo Narrow","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
html,body{margin:0;padding:0;height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--mono);overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.panel{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px);max-height:calc(100% - 32px);overflow:auto;box-sizing:border-box;
  background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.panel h1{margin:0;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.04em;text-transform:uppercase}
.row{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.row span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);width:64px}
.row button{font-family:var(--mono);font-size:11px;color:var(--ink);background:transparent;border:1px solid var(--line);padding:5px 8px;cursor:pointer}
.row button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.row button:focus-visible{outline:1px solid var(--accent);outline-offset:2px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ph button{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:transparent;border:1px solid var(--line);padding:4px 8px;cursor:pointer}
.ph button:focus-visible{outline:1px solid var(--accent);outline-offset:2px}
.panel.min{padding:8px 10px}.panel.min>*:not(.ph){display:none}.panel.min h1{font-size:13px}
.shot .panel{display:none}
@media (max-width:560px){.row span{width:100%}}
</style>
</head>
<body>
<canvas id="c" aria-label="3D render of the plywood desk and shelf wall, one unit or two side by side"></canvas>
<div class="panel" id="panel"><div class="ph"><h1>Desk wall · 1 or 2 units</h1><button type="button" id="hidebtn" aria-expanded="true">Hide</button></div></div>
<script>
(() => { const p = document.getElementById('panel'), b = document.getElementById('hidebtn');
  const set = min => { p.classList.toggle('min', min); b.textContent = min ? 'Show options' : 'Hide'; b.setAttribute('aria-expanded', String(!min)); try { localStorage.setItem('roomPanelMin', min ? '1' : ''); } catch (e) {} };
  let start = false; try { start = localStorage.getItem('roomPanelMin') === '1'; } catch (e) {}
  set(start); b.addEventListener('click', () => { set(!p.classList.contains('min')); b.blur(); }); })();
</script>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>

// units: feet. Main room X 0..19, Z 0..11.98. East wall = Z 0 (long solid wall). Windows on X 0 face north-ish: no direct sun.
const H = 8, T = 0.35, TOP = 7.96;   // ceiling, wall thickness, uprights (a half inch short of 8 ft)
const params = (location.hash || '#front').slice(1).split('.');

function P(x1, x2, y1, y2, z1, z2, parent = cur, solid = false) {

{ const row = document.createElement('div'); row.className = 'row'; row.innerHTML = '<span>Mode</span>';
