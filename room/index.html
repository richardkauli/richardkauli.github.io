<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Richie's Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
html,body{margin:0;padding:0}
/* Layout: full-bleed 3D viewport, a spec tag top-left, camera presets along the bottom edge. Single dark look on purpose (it's a render viewer). */
:root{
  --ink:#ece6dc; --muted:#a39a8c; --ground:#151311; --panel:rgba(21,19,17,.78);
  --line:rgba(236,230,220,.16); --accent:#c98a4b; --steel:#2a2a2c;
  --display:"Archivo Narrow","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--mono);overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.tag{position:fixed;left:16px;top:calc(16px + env(safe-area-inset-top,0px));max-width:min(330px,calc(100% - 32px));
  background:var(--panel);backdrop-filter:blur(8px);border:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.tag h1{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;margin:0;text-transform:uppercase;text-wrap:balance}
.tag p{margin:0;font-size:11px;line-height:1.55;color:var(--muted)}
.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sw div{display:flex;flex-direction:column;gap:4px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sw i{display:block;height:18px;border:1px solid var(--line)}
.tag button.toggle{all:unset;cursor:pointer;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.tag button.toggle:focus-visible{outline:1px solid var(--accent);outline-offset:3px}
.optbtn{position:fixed;left:16px;top:calc(16px + env(safe-area-inset-top,0px));z-index:2;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:9px 14px;cursor:pointer;backdrop-filter:blur(8px)}
.optbtn:focus-visible{outline:1px solid var(--accent);outline-offset:2px}
.ctl[hidden]{display:none}
.ctl{position:fixed;left:16px;top:calc(56px + env(safe-area-inset-top,0px));display:grid;grid-template-columns:1fr;gap:8px;padding:12px;width:220px;max-height:calc(100% - 72px);overflow:auto;
  background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px);box-sizing:border-box}
.ctl label{display:flex;flex-direction:column;gap:4px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ctl select{font-family:var(--mono);font-size:12px;color:var(--ink);background:#1d1a18;border:1px solid var(--line);padding:6px 8px;border-radius:0;cursor:pointer}
.ctl select:disabled{opacity:.45;cursor:not-allowed}
.ctl select:focus-visible{outline:1px solid var(--accent);outline-offset:2px}
@media (max-width:600px){.ctl{top:calc(56px + env(safe-area-inset-top,0px));left:12px;right:12px;width:auto;grid-template-columns:1fr 1fr;max-height:45%}}
.hint{position:fixed;right:16px;top:calc(16px + env(safe-area-inset-top,0px));font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.walknote{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:9px 14px;transition:opacity .6s;pointer-events:none;white-space:nowrap}
.walknote.fade{opacity:0}
.pad{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:none;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,56px);gap:6px;z-index:2;user-select:none;-webkit-user-select:none}
.pad button{all:unset;display:flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--line);color:var(--ink);font-size:20px;touch-action:none;-webkit-tap-highlight-color:transparent}
.pad button.on{background:#3a332d}
.pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
@media (pointer:coarse){body.walking .pad{display:grid}}
.shot .tag,.shot .ctl,.shot .optbtn,.shot .hint,.shot .walknote,.shot .pad{display:none}
@media (max-width:520px){.hint{display:none}.tag{padding:10px 12px}.tag h1{font-size:18px}}
</style>
</head>
<body>

<canvas id="c" aria-label="3D render of the room"></canvas>
<div class="walknote" id="walknote" hidden>W A S D to walk · drag to look · Shift to run</div>
<div class="pad" id="pad" aria-label="Walk controls"><button class="u" data-k="arrowup" aria-label="Forward">▲</button><button class="l" data-k="arrowleft" aria-label="Step left">◀</button><button class="d" data-k="arrowdown" aria-label="Back">▼</button><button class="r" data-k="arrowright" aria-label="Step right">▶</button></div>
<button type="button" class="optbtn" id="optbtn" aria-expanded="false" aria-controls="ctl">Options</button>
<form class="ctl" id="ctl" aria-label="Room options" onsubmit="return false" hidden>
  <label for="s-mode">Mode<select id="s-mode"><option value="orbit">Orbit (drag to rotate)</option><option value="walk">Walk (WASD + drag to look)</option></select></label>
  <label for="s-layout">Layout<select id="s-layout"></select></label>
  <label for="s-view">View<select id="s-view"></select></label>
  <label for="s-work">Work side<select id="s-work"></select></label>
  <label for="s-sleep">Bed / couch<select id="s-sleep"></select></label>
  <label for="s-bed">Bed layout<select id="s-bed"></select></label>
  <label for="s-couch">Couch layout<select id="s-couch"></select></label>
  <label for="s-fold">Fold-out table<select id="s-fold"></select></label>
  <label for="s-desk">Desk<select id="s-desk"></select></label>
  <label for="s-sew">Sewing table<select id="s-sew"></select></label>
  <label for="s-above">Above bed<select id="s-above"></select></label>
  <label for="s-bean">Bean bag<select id="s-bean"></select></label>
  <label for="s-hall">Hall curtain<select id="s-hall"></select></label>
</form>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script>
(()=>{const b=document.getElementById('optbtn'),f=document.getElementById('ctl');
b.addEventListener('click',()=>{const o=f.hidden;f.hidden=!o;b.setAttribute('aria-expanded',o);b.textContent=o?'Close':'Options';});})();
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { Reflector } from 'three/addons/objects/Reflector.js';

// ---------- setup (units: feet; plan inches -> X=(x-207.6)/12, Z=(98.5-y)/12) ----------
const H = 8, T = 0.35;
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.35;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x151311);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

let seed = 11;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const R = (a, b) => a + (b - a) * rnd();

function mesh(geo, mat, cast = true, recv = true) { const m = new THREE.Mesh(geo, mat); m.castShadow = cast; m.receiveShadow = recv; return m; }
function B(mat, x1, x2, y1, y2, z1, z2, parent = scene) { const m = mesh(new THREE.BoxGeometry(x2 - x1, y2 - y1, z2 - z1), mat); m.position.set((x1 + x2) / 2, (y1 + y2) / 2, (z1 + z2) / 2); parent.add(m); return m; }
function RB(mat, x1, x2, y1, y2, z1, z2, r = 0.12, parent = scene) { const m = mesh(new RoundedBoxGeometry(x2 - x1, y2 - y1, z2 - z1, 4, r), mat); m.position.set((x1 + x2) / 2, (y1 + y2) / 2, (z1 + z2) / 2); parent.add(m); return m; }
function C(mat, r1, r2, h, x, y, z, seg = 24, parent = scene) { const m = mesh(new THREE.CylinderGeometry(r1, r2, h, seg), mat); m.position.set(x, y + h / 2, z); parent.add(m); return m; }
function cv(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
function tex(c, rx = 1, ry = 1, srgb = true) { const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); t.anisotropy = 8; if (srgb) t.colorSpace = THREE.SRGBColorSpace; return t; }

// ---------- procedural textures ----------
function woodCanvas(w, h, rows, hue, sat, l1, l2, gap = 2) {
  const [c, g] = cv(w, h); const rh = h / rows;
  for (let r = 0; r < rows; r++) {
    let x = -R(0, w * 0.6);
    while (x < w) {
      const len = R(w * 0.3, w * 0.8), L = R(l1, l2), y0 = r * rh;
      g.fillStyle = `hsl(${hue + R(-4, 4)},${sat}%,${L}%)`; g.fillRect(x, y0, len, rh);
      for (let i = 0; i < rh * 0.8; i++) {
        const yy = y0 + R(0, rh), amp = R(0.4, 2.5), f = R(0.004, 0.02), ph = R(0, 6);
        g.strokeStyle = `hsla(${hue},${sat}%,${L + R(-14, 8)}%,${R(0.05, 0.22)})`; g.lineWidth = R(0.5, 1.6);
        g.beginPath(); g.moveTo(x, yy); for (let xx = 0; xx <= len; xx += 14) g.lineTo(x + xx, yy + Math.sin(xx * f + ph) * amp); g.stroke();
      }
      if (rnd() < 0.2) { const kx = x + R(20, len - 20), ky = y0 + R(rh * .3, rh * .7); for (let k = 0; k < 5; k++) { g.strokeStyle = `hsla(${hue},${sat}%,${L - 16}%,.28)`; g.beginPath(); g.ellipse(kx, ky, 4 + k * 4, 2 + k * 1.4, 0, 0, 7); g.stroke(); } }
      g.fillStyle = 'rgba(25,15,8,.55)'; g.fillRect(x, y0, gap, rh);
      x += len;
    }
    g.fillStyle = 'rgba(25,15,8,.6)'; g.fillRect(0, r * rh, w, gap);
  }
  return c;
}
function cmuCanvases() {
  const W = 1024, Hh = 512; const [c, g] = cv(W, Hh); const [b, bg] = cv(W, Hh);
  g.fillStyle = '#b2ada4'; g.fillRect(0, 0, W, Hh); bg.fillStyle = '#000'; bg.fillRect(0, 0, W, Hh);
  const bw = 256, bh = 128, m = 7;
  for (let r = 0; r < 4; r++) { const off = (r % 2) * 128; for (let i = -1; i < 5; i++) { const x = i * bw + off, y = r * bh;
    g.fillStyle = `hsl(38,4%,${R(52,62)}%)`; g.fillRect(x + m / 2, y + m / 2, bw - m, bh - m);
    bg.fillStyle = '#c4c4c4'; bg.fillRect(x + m / 2, y + m / 2, bw - m, bh - m); } }
  for (let i = 0; i < 110000; i++) { const x = R(0, W), y = R(0, Hh), d = rnd() < .5, s = R(.6, 2.4);
    g.fillStyle = d ? `rgba(40,38,34,${R(.1,.4)})` : `rgba(235,232,225,${R(.1,.3)})`; g.fillRect(x, y, s, s);
    bg.fillStyle = d ? 'rgba(0,0,0,.35)' : 'rgba(255,255,255,.25)'; bg.fillRect(x, y, s, s); }
  return [c, b];
}
function speckle(base, n = 9000) { const [c, g] = cv(256, 256); g.fillStyle = base; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < n; i++) { g.fillStyle = rnd() < .5 ? `rgba(30,30,28,${R(.1,.4)})` : `rgba(240,238,230,${R(.1,.3)})`; const s = R(.6, 2); g.fillRect(R(0,256), R(0,256), s, s); } return c; }

const floorTex = tex(woodCanvas(1024, 1024, 14, 30, 38, 44, 56), 21 / 8.53, 14 / 8.53);
const oakTex = tex(woodCanvas(512, 512, 7, 32, 40, 50, 60, 1));
const walnutTex = tex(woodCanvas(512, 512, 6, 26, 35, 26, 36, 1));
const reclaimTex = tex(woodCanvas(512, 512, 5, 28, 25, 30, 52, 2));
const [cmuC, cmuB] = cmuCanvases();
const cmuMap = tex(cmuC, 228 / 64, 96 / 32), cmuBump = tex(cmuB, 228 / 64, 96 / 32, false);

// ---------- materials ----------
const M = {
  floor: new THREE.MeshStandardMaterial({ map: floorTex, roughness: .55, envMapIntensity: .5 }),
  paint: new THREE.MeshStandardMaterial({ color: 0xf4f2ee, roughness: .93, envMapIntensity: .35 }),
  trim: new THREE.MeshStandardMaterial({ color: 0x6b4226, roughness: .45, envMapIntensity: .5 }),
  ceil: new THREE.MeshStandardMaterial({ color: 0xf0ebe2, roughness: .95, envMapIntensity: .3 }),
  cmu: new THREE.MeshStandardMaterial({ map: cmuMap, bumpMap: cmuBump, bumpScale: 2.5, roughness: .97, envMapIntensity: .35 }),
  block: new THREE.MeshStandardMaterial({ map: tex(speckle('#8e8a83')), roughness: .97, envMapIntensity: .35 }),
  oak: new THREE.MeshStandardMaterial({ map: oakTex, roughness: .6, envMapIntensity: .5 }),
  walnut: new THREE.MeshStandardMaterial({ map: walnutTex, roughness: .55, envMapIntensity: .5 }),
  reclaim: new THREE.MeshStandardMaterial({ map: reclaimTex, roughness: .8, envMapIntensity: .4 }),
  steel: new THREE.MeshStandardMaterial({ color: 0x1e1e20, metalness: .75, roughness: .42 }),
  brass: new THREE.MeshStandardMaterial({ color: 0xb08a4a, metalness: .9, roughness: .35 }),
  linen: new THREE.MeshStandardMaterial({ color: 0xe8e2d6, roughness: 1 }),
  duvet: new THREE.MeshStandardMaterial({ color: 0x5f6748, roughness: 1 }),
  rust: new THREE.MeshStandardMaterial({ color: 0x9a4c2c, roughness: 1 }),
  leather: new THREE.MeshStandardMaterial({ color: 0x7a4325, roughness: .55, envMapIntensity: .6 }),
  terracotta: new THREE.MeshStandardMaterial({ color: 0xb2633c, roughness: .9 }),
  concrete: new THREE.MeshStandardMaterial({ map: tex(speckle('#9a978f', 5000)), roughness: .95 }),
  soil: new THREE.MeshStandardMaterial({ color: 0x2b1f16, roughness: 1 }),
  stem: new THREE.MeshStandardMaterial({ color: 0x5b6b33, roughness: .9 }),
  trunk: new THREE.MeshStandardMaterial({ color: 0x6a5038, roughness: .95 }),
  glass: new THREE.MeshStandardMaterial({ color: 0xcfe3ea, transparent: true, opacity: .12, roughness: .05, metalness: 0, depthWrite: false }),
  mirror: new THREE.MeshStandardMaterial({ color: 0xdfe6e8, metalness: 1, roughness: .04 }),
  dark: new THREE.MeshStandardMaterial({ color: 0x111112, roughness: .5 }),
  white: new THREE.MeshStandardMaterial({ color: 0xf2efe9, roughness: .6 }),
};
const leafMats = [0x3d6a33, 0x2e5a2a, 0x4c7a38, 0x5f8a40, 0x355f2c].map(c => new THREE.MeshStandardMaterial({ color: c, roughness: .65, side: THREE.DoubleSide, envMapIntensity: .6 }));
const leafMat = () => leafMats[Math.floor(rnd() * leafMats.length)];
const leafGeo = new THREE.SphereGeometry(1, 10, 6);

// ---------- shell ----------
const floor = mesh(new THREE.PlaneGeometry(21, 14), M.floor, false, true);
floor.rotation.x = -Math.PI / 2; floor.position.set(9.5, 0, 6); scene.add(floor);
const ceiling = B(M.ceil, -0.4, 19.4, H, H + 0.25, -0.4, 12.4);

function wallRun(axis, a1, a2, c, out, openings, mat = M.paint) {
  const cuts = [...openings].sort((p, q) => p[0] - q[0]); let cur = a1; const pcs = [];
  for (const [o1, o2, b, t] of cuts) { if (o1 > cur) pcs.push([cur, o1, 0, H]); if (b > 0) pcs.push([o1, o2, 0, b]); if (t < H) pcs.push([o1, o2, t, H]); cur = o2; }
  if (cur < a2) pcs.push([cur, a2, 0, H]);
  const c1 = out > 0 ? c : c - T, c2 = out > 0 ? c + T : c;
  for (const [p1, p2, y1, y2] of pcs) axis === 'x' ? B(mat, p1, p2, y1, y2, c1, c2) : B(mat, c1, c2, y1, y2, p1, p2);
  // brown baseboard on the room side of every solid wall piece
  const t1 = out > 0 ? c - 0.06 : c, t2 = out > 0 ? c : c + 0.06;
  for (const [p1, p2, y1] of pcs) if (y1 === 0) axis === 'x' ? B(M.trim, p1, p2, 0, 0.36, t1, t2) : B(M.trim, t1, t2, 0, 0.36, p1, p2);
}
// top wall: raw CMU on the room face
{ const m = mesh(new THREE.BoxGeometry(19 + 2 * T, H, T), M.paint);
  m.position.set(9.5, H / 2, -T / 2); scene.add(m); B(M.trim, -0.1, 19.1, 0, 0.36, 0, 0.06); }
const WIN = [[1.9, 7.65]], SILL = 3.0, HEAD = 6.9, DOOR = 6.9;
wallRun('z', -T, 7.93, 0, -1, WIN.map(([a, b]) => [a, b, SILL, HEAD]));          // left (exterior)
wallRun('x', -T, 1.79, 7.93, 1, []);                                             // step return
wallRun('z', 7.93, 12.33, 1.79, -1, []);                                         // step wall
wallRun('z', -T, 12.33, 19, 1, [[8.43, 11.98, 0, DOOR]]);                        // right, entry opening
wallRun('x', 1.44, 19 + T, 11.98, 1, [[1.79, 4.75, 0, DOOR], [9.4, 12.35, 0, DOOR], [12.86, 17.46, 0, DOOR]]); // bottom

// window: one wide double-hung unit, natural wood frame (as in the photos)
for (const [a, b] of WIN) {
  const x1 = -0.24, x2 = -0.06, w = 0.16, F = M.oak;
  B(F, x1, x2, SILL, SILL + w, a, b); B(F, x1, x2, HEAD - w, HEAD, a, b);
  B(F, x1, x2, SILL, HEAD, a, a + w); B(F, x1, x2, SILL, HEAD, b - w, b);
  const mid = (a + b) / 2, my = (SILL + HEAD) / 2;
  B(F, x1, x2, SILL, HEAD, mid - 0.07, mid + 0.07); B(F, x1, x2, my - 0.07, my + 0.07, a, b);
  const g = mesh(new THREE.PlaneGeometry(b - a, HEAD - SILL), M.glass, false, false); g.rotation.y = Math.PI / 2; g.position.set(-0.15, my, mid); scene.add(g);
}
// view out: morning sky over low Brooklyn rooftops
{ const [c, g] = cv(1600, 700); const gr = g.createLinearGradient(0, 0, 0, 700);
  gr.addColorStop(0, '#141c33'); gr.addColorStop(.6, '#2c3a5c'); gr.addColorStop(1, '#6a5a72'); g.fillStyle = gr; g.fillRect(0, 0, 1600, 700);
  let x = 0; while (x < 1600) { const w = R(60, 180), h = R(120, 330); g.fillStyle = `hsl(230,${R(10,20)}%,${R(10,18)}%)`; g.fillRect(x, 700 - h, w, h);
    g.fillStyle = 'rgba(255,205,140,.75)'; for (let wy = 700 - h + 20; wy < 690; wy += 36) for (let wx = x + 10; wx < x + w - 14; wx += 26) g.fillRect(wx, wy, 12, 18); x += w + R(0, 8); }
  const m = new THREE.Mesh(new THREE.PlaneGeometry(60, 18), new THREE.MeshBasicMaterial({ map: tex(c) }));
  m.rotation.y = Math.PI / 2; m.position.set(-12, 3.2, 10); scene.add(m); }

// ---------- cinderblock ----------
// 16x8x8 nominal (15.625 x 7.625 x 7.625 in). Built with holes through Z; group rotations orient it.
const BL = 1.302, BH = 0.635, BD = 0.635, SH = 0.105;
function block(parent) { const g = new THREE.Group();
  B(M.block, -BL / 2, BL / 2, BH / 2 - SH, BH / 2, -BD / 2, BD / 2, g); B(M.block, -BL / 2, BL / 2, -BH / 2, -BH / 2 + SH, -BD / 2, BD / 2, g);
  for (const x of [-BL / 2, -SH / 2, BL / 2 - SH]) B(M.block, x, x + SH, -BH / 2 + SH, BH / 2 - SH, -BD / 2, BD / 2, g);
  parent.add(g); return g; }
function blockAt(x, y, z, { stand = false, rotY = 0, holesUp = false } = {}) {
  const outer = new THREE.Group(); outer.position.set(x, y, z); outer.rotation.y = rotY; scene.add(outer);
  const b = block(outer); if (stand) b.rotation.z = Math.PI / 2; if (holesUp) b.rotation.x = Math.PI / 2; return outer; }

// ---------- plants ----------
function pot(x, z, r, h, mat = M.terracotta, y = 0) { C(mat, r, r * 0.8, h, x, y, z); C(M.soil, r * 0.92, r * 0.92, 0.02, x, y + h - 0.06, z); return y + h - 0.04; }
function leaf(x, y, z, sx, sz, rx, ry, rz) { const m = mesh(leafGeo, leafMat()); m.scale.set(sx, 0.025, sz); m.position.set(x, y, z); m.rotation.set(rx, ry, rz, 'YXZ'); scene.add(m); return m; }

  const vkeys = Object.keys(VIEWS); const sv = document.getElementById('s-view');
  vkeys.forEach(k => { const o = document.createElement('option'); o.value = k; o.textContent = VIEW_NAMES[k] || k; sv.appendChild(o); });
  sv.value = pick('view', vkeys.find(k => params.includes(k)) || 'entrance'); if (DEF.view) setView(DEF.view, true); sv.addEventListener('change', () => { if (walkS.on) setWalk(false); setView(sv.value); sv.blur(); });
  const sm = document.getElementById('s-mode'); sm.addEventListener('change', () => { setWalk(sm.value === 'walk'); sm.blur(); }); if (params.includes('walk') || !location.hash) setWalk(true, [16.6, 9.8, Math.PI / 2 - 0.35]);
  dd('s-work', WORK.map(w => w.name), pick('work', params.includes('work1') ? 1 : 0), i => { setWork(i); refresh(); });
  const bm = params.find(p => /^bed\d$/.test(p));
  dd('s-bed', BEDS.map(b => b.name), pick('bed', bm ? +bm[3] : 0), i => { setBed(i); refresh(); });
  const fe = dd('s-fold', ['Stored (hallway)', 'Open (middle)'], pick('fold', params.includes('foldopen') ? 1 : 0), i => { foldOpen.visible = i === 1; foldStored.visible = i !== 1; });
  setFold = v => { fe.value = v ? 1 : 0; foldOpen.visible = v; foldStored.visible = !v; };
  if (pick('work', params.includes('work1') ? 1 : 0) === 1) setWork(1); if (pick('fold', -1) === 0) setFold(false);
  dd('s-desk', ['Mine (sticker drawers)', 'Cinderblock'], pick('desk', params.includes('blockdesk') ? 1 : 0), i => { deskMine.visible = i === 0; deskBlock.visible = i === 1; });
  dd('s-sew', ['Mine (mint top)', 'Oak top + black legs'], pick('sew', params.includes('oaksew') ? 1 : 0), i => { sewMine.visible = i === 0; sewNew.visible = i === 1; });
  dd('s-above', ABOVE.map(a => a[0]), pick('above', Math.max(0, ABOVE.findIndex(a => params.includes(a[0].toLowerCase().replace(/[^a-z]/g, ''))))), i => ABOVE.forEach(([, g], j) => g.visible = j === i));
  dd('s-bean', BEAN_COLORS.map(c => c[0]), pick('bean', Math.max(0, BEAN_COLORS.findIndex(c => params.includes(c[0].toLowerCase())))), i => beanMat.color.setHex(BEAN_COLORS[i][1]));
  dd('s-hall', ['Off', 'On'], pick('hall', params.includes('hallc') ? 1 : 0), i => { hallCurtain.visible = i === 1; });
  dd('s-layout', ['Custom (options below)', 'Feng shui'], pick('layout', params.includes('fengshui') ? 1 : 0), () => refresh());
  const cm = params.find(p => /^couch\d$/.test(p));
  dd('s-sleep', ['Bed', 'Couch', 'Couch pulled out', 'Couch out + green sheets'], pick('sleep', params.includes('couchsheets') ? 3 : params.includes('couchout') ? 2 : cm ? 1 : 0), () => refresh());
  dd('s-couch', COUCHES.map(c => c.name), pick('couch', cm ? +cm[5] : 0), () => refresh());
  uiReady = true; refresh(); }


function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
let frames = 0;
renderer.setAnimationLoop(() => {
  if (anim) { const k = Math.min(1, (performance.now() - anim.s) / 900), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    camera.position.lerpVectors(anim.from.p, anim.to.p, e); controls.target.lerpVectors(anim.from.t, anim.to.t, e); camera.fov = anim.from.fov + (anim.to.fov - anim.from.fov) * e; camera.updateProjectionMatrix(); if (k === 1) anim = null; }
  ceiling.visible = camera.position.y < H; CEILS.forEach(c => c.visible = ceiling.visible);
  const now = performance.now(), dt = Math.min(0.05, (now - walkS.last) / 1000); walkS.last = now;
  if (walkS.on) walkStep(dt); else controls.update(); renderer.render(scene, camera);
  if (++frames === 4) window.__ready = true;
});
