name: FIT seat watch

on:
  schedule:
    - cron: '*/5 * * * *'    # check trigger (GitHub best-effort; each run then loops internally)
    - cron: '0 12 * * *'     # daily digest at 08:00 America/New_York (EDT = UTC-4)
  workflow_dispatch:
    inputs:
      mode:
        description: 'check | digest | snapshot'
        default: check

# The looping check runs in its own group so a run stays alive ~5.7h doing 5-min checks,
# with the next scheduled trigger queued behind it (continuous coverage). Digest / manual
# runs use a separate group so they are never blocked by the long check loop.
concurrency:
  group: seatwatch-${{ (github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *') && 'check' || 'aux' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Determine mode
        id: m
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "0 12 * * *" ]; then MODE=digest; else MODE=check; fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE"

      - name: Restore saved seat state
        uses: actions/cache/restore@v4
        with:
          path: |
            classes/state.json
            classes/events.jsonl
          key: seatwatch-state-${{ github.run_id }}
          restore-keys: |
            seatwatch-state-

      - name: Run watcher
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: |
          MODE="${{ steps.m.outputs.mode }}"
          if [ "$MODE" = "check" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            END=$(( $(date +%s) + 20400 ))   # loop ~5h40m of checks, every 5 min
            echo "Looping 5-min checks for ~5.7h"
            while [ "$(date +%s)" -lt "$END" ]; do
              if [ "$(date -u +%Y%m%d)" -gt 20260907 ]; then echo "past watch window; stopping"; break; fi
              python3 classes/watch.py check || true
              rem=$(( END - $(date +%s) ))
              if [ "$rem" -gt 300 ]; then sleep 300; else break; fi
            done
          else
            echo "single run: $MODE"
            python3 classes/watch.py "$MODE"
          fi

      - name: Save seat state
        if: always() && steps.m.outputs.mode == 'check'
        uses: actions/cache/save@v4
        with:
          path: |
            classes/state.json
            classes/events.jsonl
          key: seatwatch-state-${{ github.run_id }}
