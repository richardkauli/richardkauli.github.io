<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Richard Kauli — The Journey</title>
<meta name="description" content="The long version: from a kid with a camera to couture, runways and a titanium leg."/>
<link rel="icon" href="https://www.richardkauli.com/favicon.png" type="image/png"/>
<style>
@font-face{font-family:'ArialBlackCustom';src:url('https://www.richardkauli.com/arial_black.ttf') format('truetype');font-weight:normal;font-style:normal;font-display:swap;}
:root{--ink:#000;--paper:#fff;--red:#ff0000;--muted:#555;--grid:#ededea;}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
html,body{margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:'Courier New',Courier,monospace;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
::selection{background:var(--red);color:#fff;}
a{color:inherit;}
h1,h2,h3{font-family:'ArialBlackCustom','Arial Black',Arial,sans-serif;margin:0;font-weight:normal;letter-spacing:-0.01em;}

.bar{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1.5px solid var(--ink);position:sticky;top:0;background:var(--paper);z-index:20;}
.bar a{font-family:'ArialBlackCustom','Arial Black',sans-serif;font-size:12px;text-transform:uppercase;text-decoration:none;letter-spacing:0.02em;}
.bar a:hover{color:var(--red);}

.hero{max-width:620px;margin:0 auto;padding:54px 24px 10px;text-align:center;}
.tag{display:inline-block;border:1.5px solid var(--red);color:var(--red);font-family:'ArialBlackCustom','Arial Black',sans-serif;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;padding:6px 14px;margin-bottom:22px;}
.hero h1{font-size:clamp(2.6rem,11vw,5rem);text-transform:uppercase;line-height:0.9;}
.hero h1 .r{color:var(--red);}
.hero p{font-size:15px;color:var(--muted);margin-top:22px;line-height:1.7;}

.timeline{position:relative;max-width:620px;margin:40px auto 0;padding:0 24px 60px;}
.timeline::before{content:"";position:absolute;left:50%;top:10px;bottom:70px;width:2px;background:var(--ink);transform:translateX(-50%);z-index:0;}
.yr{position:relative;z-index:2;text-align:center;margin:40px 0 0;}
.yr span{display:inline-block;background:var(--ink);color:var(--paper);font-family:'ArialBlackCustom','Arial Black',sans-serif;font-size:17px;letter-spacing:0.03em;padding:5px 16px;}
.yr::after{content:"";display:block;width:9px;height:9px;border-radius:50%;background:var(--red);margin:8px auto 0;}

.card{position:relative;z-index:1;background:var(--paper);border:1.6px solid var(--ink);margin-top:16px;box-shadow:7px 8px 0 rgba(0,0,0,0.08);
  opacity:0;transform:translateY(26px);transition:opacity .5s ease,transform .5s ease;}
.card.in{opacity:1;transform:none;}
.cimg{width:100%;overflow:hidden;border-bottom:1.6px solid var(--ink);background:#e9e9e9;display:flex;align-items:center;justify-content:center;}
.cimg img{width:100%;height:100%;max-height:360px;object-fit:cover;display:block;}
.ctile{width:100%;height:150px;display:flex;align-items:center;justify-content:center;background:var(--grid);font-family:'ArialBlackCustom','Arial Black',sans-serif;font-size:34px;letter-spacing:0.02em;}
.ctile svg{height:40px;width:auto;fill:var(--ink);}
.ctext{padding:20px 22px 24px;}
.ctext h3{font-size:1.15rem;text-transform:uppercase;line-height:1.1;}
.ctext .story{font-size:14px;line-height:1.7;color:var(--ink);margin-top:12px;}
.ctext .more{display:inline-block;margin-top:14px;font-family:'ArialBlackCustom','Arial Black',sans-serif;font-size:11px;text-transform:uppercase;text-decoration:none;color:var(--red);}
.ctext .more:hover{text-decoration:underline;}
.card.finale{border-color:var(--red);}
.card.finale h3{color:var(--red);}
.card.finale .sig{margin-top:14px;font-family:'ArialBlackCustom','Arial Black',sans-serif;}

.end{max-width:620px;margin:0 auto;padding:30px 24px 70px;text-align:center;}
.end h2{font-size:clamp(1.8rem,7vw,3rem);text-transform:uppercase;}
.end h2 .r{color:var(--red);}
.end .links{margin-top:22px;display:flex;flex-wrap:wrap;gap:18px;justify-content:center;}
.end .links a{font-family:'ArialBlackCustom','Arial Black',sans-serif;font-size:13px;text-transform:uppercase;text-decoration:none;}
.end .links a:hover{color:var(--red);}
</style>
</head>
<body>

<div class="bar">
  <a href="https://www.richardkauli.com">← richardkauli.com</a>
  <a href="./">The timeline →</a>
</div>

<header class="hero">
  <span class="tag">✦ The Journey</span>
  <h1>The <span class="r">Journey</span></h1>
  <p>The long version — from a kid with a camera in Brooklyn to couture, international runways and a titanium leg. Hi, Day One.</p>
</header>

<main class="timeline" id="tl"></main>

<section class="end">
  <h2>Let's <span class="r">talk</span>.</h2>
  <div class="links">
    <a href="mailto:rich@richardkauli.com">rich@richardkauli.com</a>
    <a href="https://www.richardkauli.com" target="_blank" rel="noopener">richardkauli.com</a>
    <a href="https://www.instagram.com/richard.kauli" target="_blank" rel="noopener">@richard.kauli</a>
  </div>
</section>

<script>
const D1SVG='<svg viewBox="0 0 80 25"><path d="M0,2.2C0,6.3,0,19.2,0,22.7c0,.4.3.8.7.9.1,0,.3,0,.4,0,2.4-.7,15.3-4.7,19.5-6,.3-.1.6-.4.6-.7,0-.2,0-.3,0-.5,0-2.2,0-5.7,0-7.7,0-.2,0-.2,0-.4,0-.3-.3-.6-.6-.7-.5-.2-15.2-4.7-19.5-6C.7,1.3.1,1.6,0,2.2h0Z" fill-rule="evenodd"></path><path d="M52.2,24.5c-6.3-6.4-6.6-17.3-.2-23.7.5-.5,0-1.1-.6-.6-6.2,6.2-16.9,6.3-23.2.2-.6-.7-1.5-.2-.7.6,6.1,6.2,6.3,16.9,0,23.1-.7.6-.2,1.4.6.7,6.2-6.1,17-6.1,23.2,0,.3.3,1,.4.9-.2h0Z"></path><path d="M69,23.4c6.1,0,11-4.9,11-10.9s-4.9-10.9-11-10.9-11,4.9-11,10.9,4.9,10.9,11,10.9Z"></path></svg>';

const CHAPTERS=[
 {year:"2020", h:"My first real work hung in The Met.", s:"I grew up with a camera in my hand. At 16 I won the Scholastic Gold and Silver Keys for photography, and a photo of mine was selected for The Metropolitan Museum of Art. Before I ever sewed a stitch, I already knew how to make people stop and look.", tile:"THE MET"},
 {year:"2021", h:"I graduated, got certified to save lives, and started cutting fabric.", s:"I finished high school in 2021 and earned my EMT certification from New York State — I liked knowing I could stay calm when everything around me wasn't. Then I bought a screen-printing press and started making clothes in my room. Nobody taught me; I just kept going until it looked like something I'd wear.", img:"../clothes/CensoredShirt/1.jpg"},
 {year:"2022", h:"I started a brand and called it “FREE”.", s:"I set up the legal side, sourced manufacturers overseas, built the Shopify, shot the lookbooks and ran the numbers. Over three years “FREE” did $20,000+ in revenue and showed in eight international shows. I was the entire department.", img:"../portfolio/2023AprZeus/1.jpg"},
 {year:"2022", h:"Then I snapped my femur in half.", s:"On May 9, 2022 a motorcycle crash broke three bones, including my femur — I've got a titanium rod in my leg now (the same thing Kat and I compared after her talk). Stuck in bed for months, I fell in love with reading, which changed how I teach myself everything. That summer I dropped out of Kingsborough with a 3.8 GPA to go all-in.", tile:"MAY 9"},
 {year:"2022", h:"I threw a pop-up about how much the feed was eating us.", s:"Two days, live screen printing, a wheat-paste campaign across NYC, 200+ people and ~$3,000 in sales — all built around one idea: put the phone down and look at something real.", img:"../clothes/EyeSeeYouButtonUp/1.jpg", link:"https://2022-artshow.freeinquotes.com/"},
 {year:"2023", h:"Then the runways started.", s:"My first shows — the CENSORED SS23 collection at Fashion Week Brooklyn and at ZEUS. I directed the vision, the styling and the set, for rooms of 100 to 200+. It was the start of eight international shows in two years.", img:"../portfolio/2023AprFWBK/1.jpg", link:"../portfolio/2023AprFWBK/"},
 {year:"2023", h:"I covered people in money.", s:"The Million Dollar series — a suit, a duffel and a backpack, all wrapped in custom “One Million Dollar” bills. Loud on purpose, and the first time a piece of mine really stopped a room.", img:"../clothes/MoneySuit/1.jpg", link:"../portfolio/2023AugJapanVillage/"},
 {year:"2023", h:"Then I took it to Japan.", s:"Collaborated with BBFL × FWBK in Osaka and designed the original garments for an independent short film, UNDER TRACKS_.", img:"../portfolio/2023SepTosh/1.jpg", link:"https://www.youtube.com/watch?v=ADoRabr_ZRU"},
 {year:"2024", h:"London. Paris.", s:"Took the POWER NAP collection to the London and Paris editions of Fashion Week Brooklyn. Same hands, bigger rooms.", img:"../portfolio/2024FebFWBKParis/1.jpg", link:"../portfolio/2024FebFWBKLondon/"},
 {year:"2024", h:"I built a TV you can wear.", s:"A fully functional wearable TV that broadcasts while you walk — a piece about screens and the scroll, inspired by vintage CRTs. It walked Runway 27 at FIT. Probably the most me thing I've ever made.", img:"../clothes/TVBackpack/1.jpg", link:"../clothes/TVBackpack/"},
 {year:"2025", h:"I finished FIT with honors and got in the room with KidSuper.", s:"AAS in Fashion Business Management — Magna Cum Laude, 3.8 GPA, Dean's List every semester — all while running a brand and showing internationally. Met Colm Dillane and designed five pieces for KidSuper. Now I'm finishing my BS in Advertising & Marketing Communications.", img:"../clothes/KidsuperTee/1.jpg", link:"../clothes/KidsuperTee/"},
 {year:"2026", h:"Now people actually watch.", s:"My reels crossed 500,000 views with no budget and no ads. I run social for VIBE TWLV and scripted, shot and edited their top-performing reel. And three days a week I hand-embroider $10,000+ gowns at Oscar de la Renta — the highest level of craft I've ever touched.", img:"../clothes/OneWayHat/1.jpg", link:"https://www.instagram.com/richard.kauli"},
 {year:"Now", h:"Which brings me to you.", s:"Everything here, I mostly made alone. The next thing I want is a team that knows more than I do, real brands, and work that gets to matter at scale. That's where Day One comes in.", tile:"D1A", finale:true, sig:"— Rich"},
];

const tl=document.getElementById('tl');
CHAPTERS.forEach(c=>{
  const yr=document.createElement('div');yr.className='yr';yr.innerHTML='<span>'+c.year+'</span>';tl.appendChild(yr);
  const card=document.createElement('article');card.className='card'+(c.finale?' finale':'');
  const media = c.img ? '<div class="cimg"><img loading="lazy" src="'+c.img+'" alt=""></div>'
    : '<div class="cimg"><div class="ctile">'+(c.tile==='D1A'?D1SVG:c.tile)+'</div></div>';
  card.innerHTML = media + '<div class="ctext"><h3>'+c.h+'</h3><div class="story">'+c.s+'</div>'
    + (c.link?'<a class="more" href="'+c.link+'"'+(/^https?:/.test(c.link)?' target="_blank" rel="noopener"':'')+'>'+(/^https?:/.test(c.link)?'See it →':'See the work →')+'</a>':'')
    + (c.sig?'<div class="sig">'+c.sig+'</div>':'') + '</div>';
  tl.appendChild(card);
});

/* reveal on scroll */
const io=new IntersectionObserver((es)=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});},{threshold:0.12});
document.querySelectorAll('.card').forEach(c=>io.observe(c));
</script>
</body>
</html>
