<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Richard Kauli — Day One</title>
<meta property="og:title" content="Richard Kauli — Day One"/>
<meta property="og:url" content="https://www.richardkauli.com/D1A/"/>
<link rel="icon" href="https://www.richardkauli.com/favicon.png" type="image/png"/>
<style>
@font-face{font-family:'ArialBlackCustom';src:url('https://www.richardkauli.com/arial_black.ttf') format('truetype');font-weight:normal;font-style:normal;font-display:swap;}
:root{--ink:#000;--paper:#fff;--red:#ff0000;--muted:#5a5a5a;--grid:#cfcfcf;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:'Courier New',Courier,monospace;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
::selection{background:var(--red);color:#fff;}
a{color:inherit;}
h1,h4{font-family:'ArialBlackCustom','Arial Black',Arial,sans-serif;margin:0;letter-spacing:-0.01em;font-weight:normal;}

.home-head{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:30px 40px 4px;}
.greet{font-size:clamp(2.1rem,5.6vw,4.2rem);text-transform:uppercase;line-height:0.9;display:flex;align-items:center;gap:0.3em;}
.greet .d1logo{display:inline-flex;align-items:center;}
.greet .d1logo svg{height:0.56em;width:auto;fill:var(--ink);display:block;}
.subhead{font-family:'Courier New',Courier,monospace;font-size:13px;line-height:1.6;color:var(--muted);max-width:560px;margin:0;}
.subhead b{color:var(--ink);font-weight:normal;}

/* ========== shared box ========== */
.bimg{width:100%;height:40px;overflow:hidden;border-bottom:1.5px solid var(--ink);background:#e9e9e9;display:flex;align-items:center;justify-content:center;}
.bimg img{width:100%;height:100%;object-fit:cover;display:block;}
.btile{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#ededea;color:var(--ink);font-family:'ArialBlackCustom','Arial Black',sans-serif;letter-spacing:0.02em;text-align:center;}
.btile.inv{background:var(--paper);color:var(--ink);}
.btile svg{height:16px;width:auto;fill:var(--ink);}
.bm{padding:4px 7px 6px;}
.bd{font-family:'Courier New',monospace;font-size:7.5px;color:var(--red);letter-spacing:0.04em;display:block;}
.box h4{font-size:8.5px;text-transform:uppercase;line-height:1.08;margin-top:2px;transition:color .15s ease;}
.bline{display:none;font-size:7px;line-height:1.35;color:var(--muted);margin-top:3px;}
.box.finale .btile{background:var(--paper);} .box.finale h4{color:var(--red);}

/* ========== DESKTOP ========== */
.hstage{position:relative;height:460px;margin-top:2px;}
.haxis{position:absolute;left:0;right:0;top:230px;height:2px;background:var(--ink);}
.hcapL,.hcapR{position:absolute;top:230px;transform:translateY(-50%);width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;}
.hcapL{left:0;border-right:9px solid var(--ink);}.hcapR{right:0;border-left:9px solid var(--ink);}
.htickY{position:absolute;top:230px;width:1.5px;height:11px;background:var(--ink);transform:translate(-50%,-50%);}
.htickYlab{position:absolute;top:236px;transform:translateX(-50%);font-family:'ArialBlackCustom','Arial Black',sans-serif;font-size:11px;background:var(--paper);padding:0 3px;z-index:2;}
.htickM{position:absolute;top:230px;width:1px;height:6px;background:var(--grid);transform:translate(-50%,-50%);}
.hnow{position:absolute;top:120px;bottom:40px;width:0;border-left:1.5px dashed var(--red);}
.hnowlab{position:absolute;top:110px;transform:translateX(-50%);font-size:9px;color:var(--red);letter-spacing:0.1em;}
.hdot{position:absolute;top:230px;transform:translate(-50%,-50%);width:7px;height:7px;border-radius:50%;background:var(--red);z-index:4;}
.hconn{position:absolute;transform:translateX(-50%);width:1.5px;background:var(--ink);z-index:1;}
.box{position:absolute;width:clamp(72px,6.2vw,94px);background:var(--paper);border:1.5px solid var(--ink);cursor:pointer;z-index:5;
  transition:transform .18s cubic-bezier(.2,.7,.3,1.4),border-color .15s ease,box-shadow .2s ease;}
.box.top{transform-origin:center bottom;}
.box.bot{transform-origin:center top;}
.box:hover{border-color:var(--red);box-shadow:0 10px 26px rgba(0,0,0,0.22);z-index:90;}
.box.top:hover{transform:translateX(-50%) scale(1.55);}
.box.bot:hover{transform:translateX(-50%) scale(1.55);}
.box:hover h4{color:var(--red);}
.box:hover .bline{display:block;}

@media (min-width:860px){ .vstage{display:none;} }
@media (max-width:859px){ .hstage{display:none;} .home-head{padding:26px 18px 4px;} }

/* ========== MOBILE ========== */
.vstage{position:relative;padding:16px 16px 0;}
.vtimeline{position:relative;}
.axisline{position:absolute;left:52px;top:0;bottom:0;width:2px;background:var(--ink);}
.months{position:absolute;left:42px;width:10px;}
.yrtick{position:absolute;left:30px;width:24px;height:2px;background:var(--ink);transform:translateY(-1px);}
.yrlabel{position:absolute;left:-6px;width:34px;text-align:right;font-family:'Courier New',monospace;font-weight:bold;font-size:11px;transform:translateY(-50%);}
.emark{position:absolute;left:44px;width:16px;height:0;border-top:2px solid var(--red);transform:translateY(-1px);z-index:3;}
.edot{position:absolute;left:52px;width:7px;height:7px;background:var(--red);transform:translate(-50%,-50%);z-index:4;}
.vconn{position:absolute;left:62px;width:48px;height:1.5px;background:var(--ink);transform:translateY(-50%);z-index:1;}
.vnode{position:absolute;left:0;right:0;height:0;}
.vcard{position:absolute;left:110px;top:0;width:calc(100vw - 134px);background:var(--paper);border:1.6px solid var(--ink);display:flex;align-items:stretch;cursor:pointer;transform:translateY(-50%);min-height:84px;}
.vthumb{width:84px;flex-shrink:0;overflow:hidden;border-right:1.6px solid var(--ink);background:#e9e9e9;display:flex;align-items:center;justify-content:center;}
.vthumb img{width:100%;height:100%;object-fit:cover;display:block;}
.vthumb .btile{font-size:17px;}
.vmeta{padding:9px 11px;display:flex;flex-direction:column;justify-content:center;}
.vd{font-family:'Courier New',monospace;font-size:10px;color:var(--red);letter-spacing:0.06em;}
.vcard h4{font-size:12px;text-transform:uppercase;line-height:1.08;margin-top:3px;}
.vcard p{font-size:10px;line-height:1.35;color:var(--muted);margin:4px 0 0;}
.vcard.finale h4{color:var(--red);font-size:15px;}

.end{padding:48px 40px 46px;border-top:2px solid var(--ink);margin-top:34px;}
.end .links{display:flex;flex-wrap:wrap;gap:22px;}
.end .links a{font-family:'ArialBlackCustom','Arial Black',sans-serif;font-size:13px;text-transform:uppercase;text-decoration:none;}
.end .links a:hover{color:var(--red);}

.ov{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .2s ease;}
.ov.open{opacity:1;pointer-events:auto;}
.modal{background:var(--paper);border:2px solid var(--ink);max-width:520px;width:100%;max-height:88vh;overflow-y:auto;position:relative;transform:translateY(12px);transition:transform .22s ease;}
.ov.open .modal{transform:none;}
.modal .x{position:absolute;top:10px;right:10px;width:34px;height:34px;border:1.5px solid var(--ink);background:var(--paper);cursor:pointer;font-size:16px;line-height:1;z-index:3;}
.modal .x:hover{background:var(--red);color:#fff;border-color:var(--red);}
.modal .mimg{width:100%;max-height:300px;overflow:hidden;border-bottom:2px solid var(--ink);background:#e9e9e9;display:flex;align-items:center;justify-content:center;}
.modal .mimg img{width:100%;height:100%;object-fit:cover;display:block;}
.modal .mimg .btile{height:120px;font-size:34px;}
.modal .mbody{padding:22px 24px 24px;}
.modal .myr{font-family:'ArialBlackCustom','Arial Black',sans-serif;color:var(--red);font-size:13px;}
.modal h3{font-size:1.5rem;text-transform:uppercase;line-height:1.02;margin:6px 0 12px;font-family:'ArialBlackCustom','Arial Black',sans-serif;}
.modal .mtext{font-size:14px;line-height:1.6;}
.modal .mlink{display:inline-block;margin-top:20px;font-family:'ArialBlackCustom','Arial Black',sans-serif;font-size:13px;text-transform:uppercase;text-decoration:none;border:1.6px solid var(--ink);padding:11px 18px;}
.modal .mlink:hover{background:var(--red);color:#fff;border-color:var(--red);}
.hint-m{display:none;}
@media (max-width:859px){ .hint-d{display:none;} .hint-m{display:inline;} }
</style>
</head>
<body>

<div class="home-head">
  <h1 class="greet">Hi,&nbsp;<a class="d1logo" href="https://d1a.com" target="_blank" rel="noopener" aria-label="Day One"><svg viewBox="0 0 80 25" aria-hidden="true"><path d="M0,2.2C0,6.3,0,19.2,0,22.7c0,.4.3.8.7.9.1,0,.3,0,.4,0,2.4-.7,15.3-4.7,19.5-6,.3-.1.6-.4.6-.7,0-.2,0-.3,0-.5,0-2.2,0-5.7,0-7.7,0-.2,0-.2,0-.4,0-.3-.3-.6-.6-.7-.5-.2-15.2-4.7-19.5-6C.7,1.3.1,1.6,0,2.2h0Z" fill-rule="evenodd"></path><path d="M52.2,24.5c-6.3-6.4-6.6-17.3-.2-23.7.5-.5,0-1.1-.6-.6-6.2,6.2-16.9,6.3-23.2.2-.6-.7-1.5-.2-.7.6,6.1,6.2,6.3,16.9,0,23.1-.7.6-.2,1.4.6.7,6.2-6.1,17-6.1,23.2,0,.3.3,1,.4.9-.2h0Z"></path><path d="M69,23.4c6.1,0,11-4.9,11-10.9s-4.9-10.9-11-10.9-11,4.9-11,10.9,4.9,10.9,11,10.9Z"></path></svg></a></h1>

<div class="hstage" id="hstage"><div class="haxis"></div><div class="hcapL"></div><div class="hcapR"></div></div>

<div class="ov" id="ov">

    <button class="x" id="mx" aria-label="Close">✕</button>

      <a class="mlink" id="mlink" target="_blank" rel="noopener" style="display:none;">View →</a></div>

<script>
const Y0=2020, Y1=2027, NOW=2026.95;
const D1SVG='<svg viewBox="0 0 80 25"><path d="M0,2.2C0,6.3,0,19.2,0,22.7c0,.4.3.8.7.9.1,0,.3,0,.4,0,2.4-.7,15.3-4.7,19.5-6,.3-.1.6-.4.6-.7,0-.2,0-.3,0-.5,0-2.2,0-5.7,0-7.7,0-.2,0-.2,0-.4,0-.3-.3-.6-.6-.7-.5-.2-15.2-4.7-19.5-6C.7,1.3.1,1.6,0,2.2h0Z" fill-rule="evenodd"></path><path d="M52.2,24.5c-6.3-6.4-6.6-17.3-.2-23.7.5-.5,0-1.1-.6-.6-6.2,6.2-16.9,6.3-23.2.2-.6-.7-1.5-.2-.7.6,6.1,6.2,6.3,16.9,0,23.1-.7.6-.2,1.4.6.7,6.2-6.1,17-6.1,23.2,0,.3.3,1,.4.9-.2h0Z"></path><path d="M69,23.4c6.1,0,11-4.9,11-10.9s-4.9-10.9-11-10.9-11,4.9-11,10.9,4.9,10.9,11,10.9Z"></path></svg>';

const EVENTS=[
 {d:2020.30, date:"Apr 2020", title:"Shown at The Met", line:"Scholastic Gold + Silver Keys for photography.", text:"Won the Scholastic Gold and Silver Keys for photography, with work selected for The Metropolitan Museum of Art.", tile:"THE MET"},
 {d:2021.40, date:"2021", title:"Graduated high school", line:"Diploma — and a head start on making things.", text:"Graduated high school in 2021. The Scholastic awards and the Met show all came out of these years.", tile:"HS"},
 {d:2021.58, date:"2021", title:"EMT certified", line:"Licensed EMT, New York State.", text:"Earned my EMT certification from New York State — trained to handle real emergencies and stay calm under pressure.", tile:"EMT"},
 {d:2021.80, date:"2021", title:"First garments", line:"Got a screen press. Started making clothes.", text:"Bought a screen-printing press and started printing shirts, then making full garments from fabric. The start of everything I make now.", img:"../clothes/CensoredShirt/1.jpg"},
 {d:2022.05, date:"2022 – 2025", title:"“FREE” — founder", line:"My brand. $20K+ revenue, 8 international shows.", text:"Founded and ran my own fashion brand “FREE” — design, production, Shopify, the analytics — and built it to $20,000+ in revenue across three years and 8 international shows.", img:"../portfolio/2023AprZeus/1.jpg", tile:"“FREE”"},
 {d:2022.35, date:"May 9, 2022", title:"Snapped my femur", line:"Motorcycle crash. Titanium rod for life.", text:"Broke three bones in a motorcycle crash on May 9, 2022 — including snapping my femur in half. That's the titanium rod Kat and I compared. Spent the recovery reading, which changed how I learn.", tile:"MAY 9"},
 {d:2022.52, date:"Summer 2022", title:"Dropped out of college", line:"Left Kingsborough CC with a 3.8 GPA.", text:"Dropped out of Kingsborough Community College the summer after I broke my leg — with a 3.8 GPA — to go all-in on my brand.", tile:"KCC"},
 {d:2022.62, date:"Jul 2022", title:"The anti-feed pop-up", line:"A 2-day pop-up about social media. 200+ people.", text:"Designed every garment, graphic and poster for a two-day fashion pop-up about the grip of social media — with live screen printing, a wheat-paste campaign across NYC, 200+ attendees and ~$3,000 in sales.", img:"../clothes/EyeSeeYouButtonUp/1.jpg", link:"https://2022-artshow.freeinquotes.com/"},
 {d:2023.28, date:"Apr 2023", title:"First runways", line:"CENSORED SS23 at Fashion Week Brooklyn.", text:"My first fashion shows — debuting the CENSORED SS23 collection at Fashion Week Brooklyn and ZEUS, directing creative vision, styling and set design for 100–200+ audiences. The start of eight international shows in two years.", img:"../portfolio/2023AprFWBK/1.jpg", link:"../portfolio/2023AprFWBK/"},
 {d:2023.55, date:"2023 – 2026", title:"FIT — Magna Cum Laude", line:"AAS 3.8 GPA, Dean's List; now finishing my BS.", text:"AAS in Fashion Business Management — Magna Cum Laude, 3.8 GPA, Dean's List every semester — now finishing my BS in Advertising & Marketing Communications.", tile:"FIT"},
 {d:2023.70, date:"Aug 2023", title:"Million Dollar debut", line:"Million Dollar series. Japan Village, Brooklyn.", text:"Debuted the Million Dollar series — sculptural pieces covered in custom “One Million Dollar” bills. The suit, the duffel and the backpack all came out of this.", img:"../clothes/MoneySuit/1.jpg", link:"../portfolio/2023AugJapanVillage/"},
 {d:2023.90, date:"Nov 2023", title:"Osaka · Under Tracks", line:"Designed garments for an independent short film.", text:"Collaborated with BBFL × FWBK in Osaka, Japan, and designed and produced the original garments for UNDER TRACKS_, an independent short film shot there.", img:"../portfolio/2023SepTosh/1.jpg", link:"https://www.youtube.com/watch?v=ADoRabr_ZRU"},
 {d:2024.14, date:"Feb 2024", title:"London & Paris", line:"The POWER NAP collection, abroad.", text:"Took the POWER NAP collection to the London and Paris editions of Fashion Week Brooklyn.", img:"../portfolio/2024FebFWBKParis/1.jpg", link:"../portfolio/2024FebFWBKLondon/"},
 {d:2024.88, date:"Nov 2024", title:"The TV Backpack", line:"A wearable TV about scroll culture. Runway 27.", text:"Designed and built the TV Backpack — a fully functional wearable TV that broadcasts while you move, inspired by vintage CRTs and our nonstop scroll culture. It walked Runway 27 at FIT.", img:"../clothes/TVBackpack/1.jpg", link:"../clothes/TVBackpack/"},
 {d:2025.12, date:"2025 – now", title:"Freelance — sets & commissions", line:"Launch sets, a DJ booth, signage + 15 commissions.", text:"15 custom garments commissioned by private clients, plus the launch sets for Tammarê and Pretune, a DJ booth and custom signage. I build the whole environment, not just the clothes.", img:"../clothes/LockedUpDress/1.jpg", tile:"SETS"},
 {d:2025.42, date:"2025", title:"KidSuper", line:"Designed five pieces. Met Colm Dillane.", text:"Met Colm Dillane of KidSuper and designed five pieces for the brand — getting in the room with people whose work I admired, and making something they'd actually wear.", img:"../clothes/KidsuperTee/1.jpg", link:"../clothes/KidsuperTee/"},
 {d:2026.05, date:"2026", title:"500K+ views", line:"Reels of my work, organically.", text:"Reels of my custom work hit 500,000+ views and 45,000+ likes, completely organic. I write, shoot and edit everything myself.", img:"../clothes/OneWayHat/1.jpg", link:"https://www.instagram.com/richard.kauli"},
 {d:2026.45, date:"2026 – now", title:"VIBE TWLV — social & retail", line:"Top reel, 20× likes; grew the account 24% in a week.", text:"Run social for a Williamsburg concept store — scripted, shot and edited the account's top reel (20× the usual likes) and grew the following 24% in a week.", tile:"V12"},
 {d:2026.70, date:"2026 – now", title:"Oscar de la Renta", line:"Hand-embroidery on $10,000+ couture gowns.", text:"Design & Embroidery intern hand-embroidering and repairing $10,000+ couture gowns for the VIP, Evening Wear and Embroidery teams. The highest level of craft I've worked at.", tile:"ODLR"},
 {d:2026.95, date:"now", title:"Day One?", line:"Everything above, mostly alone. Next: a team.", text:"Everything on this timeline, I made mostly alone. The next thing I want is a real team, real brands, and work that gets to matter at scale. That's you. Let's talk.", tile:"D1A", finale:true},
];

function tileHTML(e){
  if(e.tile==='D1A') return '<div class="btile inv">'+D1SVG+'</div>';
  const t=e.tile, n=t.replace(/[^A-Za-z0-9]/g,'').length;
  const fs = n<=3?18 : n<=4?15 : n<=6?12 : 9;
  return '<div class="btile'+(e.finale?' inv':'')+'" style="font-size:'+fs+'px">'+t+'</div>';
}
function imgArea(e,cls){ return '<div class="'+cls+'">'+(e.img?'<img loading="lazy" src="'+e.img+'" alt="">':tileHTML(e))+'</div>'; }

/* ---------- DESKTOP ---------- */
(function(){
  const stage=document.getElementById('hstage');
  const L=6,R=94, AX=230;
  const xp=d=>L+(d-Y0)/(Y1-Y0)*(R-L);
  for(let yr=2020;yr<=2027;yr++){
    const t=document.createElement('div');t.className='htickY';t.style.left=xp(yr)+'%';stage.appendChild(t);
    const l=document.createElement('div');l.className='htickYlab';l.style.left=xp(yr)+'%';l.textContent=yr;stage.appendChild(l);
    if(yr<2027)for(let m=1;m<12;m++){const mt=document.createElement('div');mt.className='htickM';mt.style.left=xp(yr+m/12)+'%';stage.appendChild(mt);}
  }
  const nl=document.createElement('div');nl.className='hnow';nl.style.left=xp(NOW)+'%';stage.appendChild(nl);
  const nlab=document.createElement('div');nlab.className='hnowlab';nlab.style.left=xp(NOW)+'%';nlab.textContent='NOW';stage.appendChild(nlab);

  const laneT=[],laneB=[]; const minSep=9.3; const rows={top:[],bot:[]};
  EVENTS.forEach((e,i)=>{
    const x=xp(e.d), top=(i%2===0);
    const lanes=top?laneT:laneB; let ln=0; while(lanes[ln]!==undefined && x-lanes[ln]<minSep) ln++; lanes[ln]=x;
    const off=32+ln*86;
    const dot=document.createElement('div');dot.className='hdot';dot.style.left=x+'%';stage.appendChild(dot);
    const conn=document.createElement('div');conn.className='hconn';conn.style.left=x+'%';
    const box=document.createElement('div');box.className='box '+(top?'top':'bot')+(e.finale?' finale':'');
    box.style.left=x+'%';
    if(top){ box.style.bottom=(460-(AX-off))+'px'; conn.style.top=(AX-off)+'px'; conn.style.height=off+'px'; }
    else   { box.style.top=(AX+off)+'px';          conn.style.top=AX+'px';        conn.style.height=off+'px'; }
    box.innerHTML=imgArea(e,'bimg')+'<div class="bm"><span class="bd">'+e.date+'</span><h4>'+e.title+'</h4><div class="bline">'+(e.line||'')+'</div></div>';
    box.addEventListener('click',()=>openModal(e));
    stage.appendChild(conn);stage.appendChild(box);
    (top?rows.top:rows.bot).push({el:box,xpc:x});
  });

  /* ripple: hovering a box pushes same-row neighbours aside */
  const R_PX=170, PUSH=58;
  function ripple(row,hoverEl){
    const w=stage.clientWidth, hc=row.find(o=>o.el===hoverEl).xpc/100*w;
    row.forEach(o=>{ if(o.el===hoverEl)return;
      const d=o.xpc/100*w-hc, ad=Math.abs(d);
      const p = ad<R_PX ? Math.sign(d)*PUSH*(1-ad/R_PX) : 0;
      o.el.style.transform='translateX(-50%) translateX('+p.toFixed(1)+'px)';
    });
  }
  function clear(row){ row.forEach(o=>{o.el.style.transform='translateX(-50%)';}); }
  ['top','bot'].forEach(k=>{ rows[k].forEach(o=>{
    o.el.addEventListener('mouseenter',()=>ripple(rows[k],o.el));
    o.el.addEventListener('mouseleave',()=>clear(rows[k]));
  });});
})();

/* ---------- MOBILE ---------- */
(function(){
  const tl=document.getElementById('vtimeline');
  const PXY=400, PAD=62;
  const H=PAD+(Y1-Y0)*PXY+96; tl.style.height=H+'px';
  const yFor=y=>PAD+(y-Y0)*PXY;
  const months=document.getElementById('months');
  months.style.top=yFor(2020)+'px'; months.style.height=((Y1-2020)*PXY)+'px';
  months.style.backgroundImage='repeating-linear-gradient(to bottom, var(--grid) 0, var(--grid) 1px, transparent 1px, transparent '+(PXY/12)+'px)';
  for(let yr=2020;yr<=2027;yr++){
    const Y=yFor(yr);
    const t=document.createElement('div');t.className='yrtick';t.style.top=Y+'px';tl.appendChild(t);
    const l=document.createElement('div');l.className='yrlabel';l.style.top=Y+'px';l.textContent=yr;tl.appendChild(l);
  }
  EVENTS.forEach(e=>{
    const Y=yFor(e.d);
    const em=document.createElement('div');em.className='emark';em.style.top=Y+'px';tl.appendChild(em);
    const d=document.createElement('div');d.className='edot';d.style.top=Y+'px';tl.appendChild(d);
    const cn=document.createElement('div');cn.className='vconn';cn.style.top=Y+'px';tl.appendChild(cn);
    const node=document.createElement('div');node.className='vnode';node.style.top=Y+'px';
    const card=document.createElement('div');card.className='vcard'+(e.finale?' finale':'');
    card.innerHTML=imgArea(e,'vthumb')+'<div class="vmeta"><span class="vd">'+e.date+'</span><h4>'+e.title+'</h4>'+(e.line?'<p>'+e.line+'</p>':'')+'</div>';
    card.addEventListener('click',()=>openModal(e));
    node.appendChild(card); tl.appendChild(node);
  });
})();

/* ---------- modal ---------- */
const ov=document.getElementById('ov'),mimg=document.getElementById('mimg'),
      myr=document.getElementById('myr'),mtitle=document.getElementById('mtitle'),mtext=document.getElementById('mtext'),mlink=document.getElementById('mlink');
function openModal(e){
  mimg.innerHTML = e.img ? '<img src="'+e.img+'" alt="">' : tileHTML(e);
  myr.textContent=e.date||'';mtitle.textContent=e.title;mtext.textContent=e.text;
  if(e.link){mlink.href=e.link;mlink.style.display='inline-block';mlink.textContent=(/^https?:/.test(e.link)?'View →':'See the work →');}
  else{mlink.style.display='none';}
  ov.classList.add('open');document.body.style.overflow='hidden';
}
function closeModal(){ov.classList.remove('open');document.body.style.overflow='';}
document.getElementById('mx').addEventListener('click',closeModal);
ov.addEventListener('click',e=>{if(e.target===ov)closeModal();});
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
</script>
</body>
