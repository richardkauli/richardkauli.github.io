<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>

// richardkauli.com/D1A (no trailing slash) would make "logo-free.png" etc. resolve to the site root and 404.
// Add the slash before anything loads so every relative path resolves inside /D1A/.
if(/\/D1A$/i.test(location.pathname))history.replaceState(null,'',location.pathname+'/'+location.search+location.hash);

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Richard Kauli — Day One</title>
<meta property="og:title" content="Richard Kauli — Day One"/>
<meta property="og:url" content="https://www.richardkauli.com/D1A/index_v6.html"/>
<link rel="icon" href="https://www.richardkauli.com/favicon.png" type="image/png"/>
<style>
@font-face{font-family:'ArialBlackCustom';src:url('https://www.richardkauli.com/arial_black.ttf') format('truetype');font-weight:normal;font-style:normal;font-display:swap;}
:root{--ink:#0a0a0a;--paper:#f4f4f4;--red:#ff0000;--muted:#6a6a6a;--grid:#cfcabf;--d1orange:#ff6a1f;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:'Courier New',Courier,monospace;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:clip;}
::selection{background:var(--red);color:#fff;}
a{color:inherit;}
h1,h2,h3,h4{font-family:'ArialBlackCustom','Arial Black',Arial,sans-serif;margin:0;letter-spacing:-0.01em;font-weight:normal;}

/* ---------- HERO ---------- */
.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:6vh 6vw;position:relative;scroll-snap-align:start;}
.greet{font-size:clamp(3.4rem,13vw,10rem);text-transform:uppercase;line-height:0.86;display:flex;align-items:center;gap:0.28em;}
.greet .d1logo{display:inline-flex;align-items:center;}
.greet .d1logo svg{height:0.5em;width:auto;fill:var(--ink);display:block;transition:fill .2s ease;}
.greet .d1logo:hover svg,.greet .d1logo:focus-visible svg{fill:var(--d1orange);}
.lead{font-size:clamp(14px,1.5vw,18px);line-height:1.65;max-width:640px;margin:28px 0 0;color:var(--ink);}
.cue{position:absolute;left:6vw;bottom:5vh;font-family:'ArialBlackCustom','Arial Black',sans-serif;font-size:12px;letter-spacing:0.22em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px;}
.cue .arr{display:inline-block;animation:bob 1.6s ease-in-out infinite;color:var(--red);font-size:16px;}
@keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(6px);}}

/* ---------- FEED ---------- */
.feed{max-width:940px;margin:0 auto;padding:11vh 6vw 0;}
.feedtop{display:flex;align-items:baseline;justify-content:space-between;gap:16px;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:30px;flex-wrap:wrap;}
.feedtop .ft1{font-family:'ArialBlackCustom','Arial Black',sans-serif;font-size:clamp(1.1rem,2.4vw,1.7rem);text-transform:uppercase;}
.feedtop .ft2{font-family:'Courier New',monospace;font-size:12px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;}

.row{display:flex;gap:clamp(14px,2vw,22px);border:2px solid var(--ink);background:var(--paper);margin-bottom:clamp(12px,1.8vh,18px);overflow:hidden;transition:opacity .55s ease,transform .55s cubic-bezier(.2,.7,.2,1),box-shadow .15s ease;}
html.anim .row{opacity:0;transform:translateY(20px);}
html.anim .row.in{opacity:1;transform:none;}
.row:hover{box-shadow:6px 6px 0 var(--ink);}
.rmedia{flex:none;width:clamp(120px,22vw,200px);align-self:stretch;overflow:hidden;border-right:2px solid var(--ink);background:#e4e0d8;}
.rmedia img{width:100%;height:100%;object-fit:cover;display:block;min-height:100%;transition:transform .5s ease;}
.row:hover .rmedia img{transform:scale(1.05);}
.rmedia.tile{background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;}
.rmedia.logo{background:#fff;display:flex;align-items:center;justify-content:center;padding:22px;}
.rmedia.logo img{width:100%;height:100%;object-fit:contain;}
.rmedia.tile .badge{font-family:'ArialBlackCustom','Arial Black',sans-serif;line-height:0.92;text-transform:uppercase;letter-spacing:0.01em;}
.rmedia.metric{background:var(--ink);color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px;}
.rmedia.metric .big{font-family:'ArialBlackCustom','Arial Black',sans-serif;font-size:clamp(1.7rem,3.6vw,2.7rem);line-height:0.9;color:var(--d1orange);}
.rmedia.metric .lab{font-size:9.5px;letter-spacing:0.12em;text-transform:uppercase;margin-top:7px;opacity:0.72;}

.rbody{padding:clamp(13px,1.7vw,19px) clamp(14px,1.8vw,22px);display:flex;flex-direction:column;justify-content:center;min-width:0;}
.rage{font-family:'ArialBlackCustom','Arial Black',sans-serif;font-size:11.5px;color:var(--red);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:5px;}
.rbody h3{font-size:clamp(1.05rem,1.9vw,1.5rem);text-transform:uppercase;line-height:1.02;margin:0 0 9px;}
.rline{font-size:13px;line-height:1.58;color:#2a2a2a;margin:0;}
.rbody .rlink{display:inline-block;align-self:flex-start;margin-top:11px;font-family:'ArialBlackCustom','Arial Black',sans-serif;font-size:9.5px;text-transform:uppercase;letter-spacing:0.05em;text-decoration:none;border-bottom:2px solid var(--red);padding-bottom:1px;}
.rbody .rlink:hover{color:var(--red);}
.row.finale{border-color:var(--ink);}
.row.finale .rmedia{border-right-color:var(--ink);background:#fff;}

/* ---------- TOOLS ---------- */
.tools{max-width:940px;margin:0 auto;padding:2vh 6vw 15vh;}
.tools h2{font-size:clamp(1.1rem,2.4vw,1.7rem);text-transform:uppercase;border-bottom:2px solid var(--ink);padding-bottom:12px;margin:0 0 18px;}
.trow{display:flex;gap:16px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--grid);flex-wrap:wrap;}
.trow .tk{font-family:'ArialBlackCustom','Arial Black',sans-serif;font-size:11px;text-transform:uppercase;color:var(--red);letter-spacing:0.06em;width:120px;flex:none;}
.trow .tv{font-size:13px;color:var(--ink);line-height:1.5;}

/* ---------- DATED RAIL ---------- */
.rail{position:fixed;left:0;right:0;bottom:0;height:70px;background:var(--paper);border-top:2px solid var(--ink);z-index:50;opacity:0;transform:translateY(100%);transition:opacity .35s ease,transform .35s ease;pointer-events:none;}
.rail.show{opacity:var(--f,1);transform:translateY(calc((1 - var(--f,1)) * 100%));}
.rail.fading{transition:none;}
.railline{position:absolute;left:0;right:0;top:40px;height:1.5px;background:var(--ink);}
.rtick{position:absolute;top:40px;width:1px;height:7px;background:var(--grid);transform:translate(-50%,-50%);}
.ryr{position:absolute;bottom:6px;transform:translateX(-50%);font-family:'Courier New',monospace;font-size:10px;color:var(--muted);}
.rdot{position:absolute;top:40px;width:7px;height:7px;border-radius:50%;background:var(--ink);transform:translate(-50%,-50%);transition:all .3s ease;z-index:2;}
.rdot.on{width:13px;height:13px;background:var(--red);box-shadow:0 0 0 4px rgba(255,0,0,0.14);}
.rtag{position:absolute;top:5px;transform:translateX(-50%);font-family:'ArialBlackCustom','Arial Black',sans-serif;font-size:10px;letter-spacing:0.06em;text-transform:uppercase;color:var(--red);white-space:nowrap;transition:left .3s ease;max-width:60vw;overflow:hidden;text-overflow:ellipsis;}

/* ---------- CTA ---------- */
.cta{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:10vh 6vw 120px;border-top:2px solid var(--ink);scroll-snap-align:start;}
.ctatools{margin:30px 0 4px;max-width:680px;width:100%;}
.ctatools .trow{display:flex;gap:16px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--grid);flex-wrap:wrap;}
.ctatools .tk{font-family:'ArialBlackCustom','Arial Black',sans-serif;font-size:11px;text-transform:uppercase;color:var(--red);letter-spacing:0.06em;width:110px;flex:none;}
.ctatools .tv{font-size:13px;color:var(--ink);line-height:1.5;}
.ctatag{font-family:'ArialBlackCustom','Arial Black',sans-serif;font-size:13px;letter-spacing:0.1em;text-transform:uppercase;color:var(--red);margin:0 0 14px;}
html.anim #cta{opacity:0;transform:translateY(24px);transition:opacity .6s ease,transform .7s cubic-bezier(.2,.7,.2,1);}
html.anim #cta.in{opacity:1;transform:none;}
.cta h2{font-size:clamp(2.8rem,9vw,8rem);line-height:0.86;text-transform:uppercase;}
.cta .ctasub{font-size:clamp(14px,1.4vw,17px);line-height:1.6;max-width:580px;margin:26px 0 0;color:var(--muted);}
.mailto{align-self:center;margin-top:0;font-family:'ArialBlackCustom','Arial Black',sans-serif;font-size:15px;text-transform:uppercase;letter-spacing:0.03em;text-decoration:none;border:2px solid var(--ink);padding:16px 26px;transition:all .15s ease;}
.mailto:hover{background:var(--red);color:#fff;border-color:var(--red);}
.links{margin-top:40px;display:flex;flex-wrap:wrap;gap:22px;}
.links a{font-family:'ArialBlackCustom','Arial Black',sans-serif;font-size:12.5px;text-transform:uppercase;text-decoration:none;}
.links a:hover{color:var(--red);}

/* ---------- END: Day One? card pins to center, grows, reveals buttons; timeline hides ---------- */
.finale{position:relative;}
.fwrap{max-width:940px;margin:0 auto;padding:0 6vw;}
.fspacer{height:62vh;}
.feed{will-change:opacity;}
#dcard{position:sticky;top:40vh;height:max-content;transform-origin:center top;transition:transform .4s cubic-bezier(.2,.7,.2,1);will-change:transform;}
html.anim #dcard{opacity:1;transform:none;}
html.anim #dcard.ending{transform:scale(1.04);}
.endcta{position:fixed;left:6vw;right:6vw;max-width:940px;margin:0 auto;top:60vh;display:flex;flex-direction:column;align-items:center;opacity:0;transform:translateY(10px);transition:opacity .12s ease,transform .14s ease;pointer-events:none;z-index:30;}
.endcta.in{opacity:1;transform:none;pointer-events:auto;}
.endlinks{position:fixed;left:0;right:0;bottom:6vh;padding:0 6vw;display:flex;justify-content:center;flex-wrap:wrap;gap:clamp(18px,3vw,42px);opacity:0;transform:translateY(14px);transition:opacity .3s ease,transform .3s cubic-bezier(.2,.7,.2,1);pointer-events:none;z-index:30;}
.endlinks.in{opacity:1;transform:none;pointer-events:auto;}
.endlinks a{font-family:'ArialBlackCustom','Arial Black',sans-serif;font-size:clamp(14px,1.6vw,18px);text-transform:uppercase;text-decoration:none;letter-spacing:0.02em;}
.endlinks a:hover{color:var(--red);}
.rail.railhide{opacity:0!important;transform:translateY(100%)!important;pointer-events:none;}

/* ---------- MOBILE ---------- */
@media (max-width:760px){
  .row{flex-direction:column;}
  .rmedia{width:100%;height:44vw;align-self:auto;border-right:none;border-bottom:2px solid var(--ink);}
  .row.finale .rmedia{border-right:none;border-bottom:2px solid var(--ink);}
  .rmedia img{min-height:0;}
  .trow .tk{width:100%;}
  .rail{height:58px;}
  .railline,.rtick,.rdot{top:32px;}
  .rtag{font-size:9px;}
}
</style>
</head>
<body>

<section class="hero">
  <h1 class="greet">Hi,&nbsp;<a class="d1logo" href="https://d1a.com" target="_blank" rel="noopener" aria-label="Day One"><svg viewBox="0 0 80 25" aria-hidden="true"><path d="M0,2.2C0,6.3,0,19.2,0,22.7c0,.4.3.8.7.9.1,0,.3,0,.4,0,2.4-.7,15.3-4.7,19.5-6,.3-.1.6-.4.6-.7,0-.2,0-.3,0-.5,0-2.2,0-5.7,0-7.7,0-.2,0-.2,0-.4,0-.3-.3-.6-.6-.7-.5-.2-15.2-4.7-19.5-6C.7,1.3.1,1.6,0,2.2h0Z" fill-rule="evenodd"></path><path d="M52.2,24.5c-6.3-6.4-6.6-17.3-.2-23.7.5-.5,0-1.1-.6-.6-6.2,6.2-16.9,6.3-23.2.2-.6-.7-1.5-.2-.7.6,6.1,6.2,6.3,16.9,0,23.1-.7.6-.2,1.4.6.7,6.2-6.1,17-6.1,23.2,0,.3.3,1,.4.9-.2h0Z"></path><path d="M69,23.4c6.1,0,11-4.9,11-10.9s-4.9-10.9-11-10.9-11,4.9-11,10.9,4.9,10.9,11,10.9Z"></path></svg></a></h1>
  <p class="lead">I'm Rich, a designer and maker from Brooklyn, NY.</p>
  <div class="cue">Scroll <span class="arr">↓</span></div>
</section>

<main class="feed">
  <div class="feedtop">
    <div class="ft1">My story</div>
  </div>
  <div id="rows"></div>
</main>

<section class="finale" id="finale">
  <div class="fwrap">
    <article class="row finale" id="dcard">
      <div class="rmedia logo"><img loading="lazy" src="dayone-orange.webp" alt=""></div>
      <div class="rbody">
        <span class="rage">23 years old</span>
        <h3>Day One?</h3>
        <p class="rline">After I Graduate with my Bachelors in Advertising and Marketing December, I think I might be perfect for Day One.</p>
      </div>
    </article>
    <div class="fspacer"></div>
  </div>
  <div class="endlinks" id="endlinks">
    <a href="tel:+12124709647">(212) 470-9647</a>
    <a href="mailto:rich@richardkauli.com">rich@richardkauli.com</a>
    <a href="https://www.instagram.com/richard.kauli" target="_blank" rel="noopener">@richard.kauli</a>
    <a href="resume.pdf" target="_blank" rel="noopener">Resume</a>
  </div>
</section>

<div class="rail" id="rail">
  <div class="railline"></div>
  <div class="rtag" id="rtag"></div>
</div>

<script>
const EVENTS=[
 {y:2020.15, date:"2020", age:"16 years old", title:"Exhibited at The MET", line:"At 16 I won a Scholastic Gold Key Award and was featured in an exhibition at The MET for this photograph I took. I grew to love creating and showing my Photos and got pretty good at it.", logo:"logo-met.png", link:"../portfolio/Photography/", linktext:"See my photography portfolio →"},
 {y:2020.45, date:"2020", age:"16 years old", title:"East River Titans Zine", line:"Quarantine started and I took the opportunity to compile a zine of all my bridge climbs. I Shot, Wrote, Designed, Printed, Bound, and Advertised it myself, <b>selling 30 copies</b> of the 40-page zine.", img:"../portfolio/2020EastRiverTitans/1.jpg", link:"../portfolio/2020EastRiverTitans/", linktext:"See the zine →"},
 {y:2022.35, date:"May 2022", age:"18 years old", title:"Resilient", line:"At 18 I snapped my femur in half in a motorcycle crash. In my 6 weeks bed bound I fell in love with reading and learning about the world. My EMS Professor, Mike advised me that Id be a great firefighter but could do a lot more than that which inspired me to focus on my passion for creating.", img:"xray.jpg"},
 {y:2022.62, date:"Jul 2022", age:"18 years old", title:"See How “FREE” You Really Are Pop-Up", line:"My friend Jules and I organized, advertised, and hosted a popup in Tribeca titled See How “FREE” You Really Are about the negative effects of social media. I created 8 custom garments and printed 150+ t shirts at the two day event. We advertised through instagram, wheat paste, and word of mouth. With <b>200+ attendees</b> we ended up making <b>$3k+ in sales</b>.", img:"popup.jpg", link:"https://free.juleslemee.com/", linktext:"See the pop-up →"},
 {y:2022.78, date:"2022 – 2025", age:"18–21 years old", title:"Founding “FREE”", line:"After the successful popup, I decided to make “FREE” a full brand. Over the course of 3 years I would generate <b>over $20k in sales</b>, and show in <b>12 fashion shows and presentations across New York, London, Paris, and Osaka.</b>", logo:"logo-free.png"},
 {y:2024.14, date:"Feb 2024", age:"20 years old", title:"International Fashion Shows", line:"Took “FREE” to London and Paris.", img:"../portfolio/2024FebFWBKLondon/17.jpg", crop:"5/4", link:"../portfolio/2024FebFWBKLondon/", linktext:"See “FREE” Power Nap Collection London 2024 →"},
 {y:2024.60, date:"2024", age:"20 years old", title:"Manufacturing the Galaxy Set", line:"After the international shows I manufactured my first pieces, the Galaxy Pants and Hoodie. Ordering <b>100 pcs</b> and selling them through “FREE”, I learned how tech packs, costing, and overseas production work.", img:"../clothes/GalaxyHoodie/1.jpg", link:"../clothes/GalaxyHoodie/", linktext:"See the hoodie →"},
 {y:2025.30, date:"2025", age:"22 years old", title:"AAS, Magna Cum Laude", line:"While building “FREE” I earned an <b>AAS for Fashion Business Management</b> with a <b>3.8 GPA</b>, <b>Magna Cum Laude</b>, and was on the <b>Deans list every semester</b>.", logo:"logo-fit.png"},
 {y:2025.55, date:"2025", age:"22 years old", title:"KidSuper Collab", line:"KidSuper was always an inspiring story of a Brooklyn boy who made it in fashion so when they had their first Peoples Runway in 2025, I applied, and got rejected. That didn’t stop me from dreaming. I found my way backstage at the event and met Colm, and ended up <b>designing 5 pieces for KidSuper</b>.", img:"../clothes/KidsuperTee/1.jpg", link:"../clothes/KidSuper/", linktext:"See KidSuper collab →"},
 {y:2026.05, date:"2026", age:"22 years old", title:"Viral Reels", line:"After 3 months of posting on trial reels I got my first and second viral videos. A video of a table I build reached <b>500,000+ views</b> and <b>45,000+ likes</b>. I scripted, shot, and edited it myself.", img:"viral-table.jpg", link:"https://www.instagram.com/reel/DZL_29FO99S/", linktext:"Watch →"},
 {y:2026.30, date:"2026 – now", age:"22–23 years old", title:"VIBE TWLV", line:"I started working at VIBE TWLV as a retail associate and after seeing their instagram, I helped with content, eventually <b>scripting filming and editing their top reel</b> (30x average likes) that <b>grew their followers by 40%</b> since and directly contributed to more visitors and sales.", logo:"logo-vibe.png"},
 {y:2026.55, date:"2026 – now", age:"23 years old", title:"Oscar de la Renta", line:"As an Intern at Oscar de la Renta I hand embroidered and repaired <b>$10,000+ gowns</b> for the VIP and evening wear departments.", logo:"logo-odlr.png"},
 {y:2026.75, date:"2025 – now", age:"23 years old", title:"Building commissions", line:"After creating a reel about my table build I got paid opportunities to build sets and other cool things for brands including this set for Tammarê.", img:"../portfolio/2026SepTammare/card.jpg", link:"../portfolio/2026SepTammare/", linktext:"See Tammarê set build →"},
];

const Y0=2018,Y1=2027;
const xp=y=>4+(y-Y0)/(Y1-Y0)*92;
const ageOf=y=>Math.floor(y-2003.649); // born Aug 25, 2003
EVENTS.sort((a,b)=>a.y-b.y);

/* ---- build rows ---- */
const rowsWrap=document.getElementById('rows');
EVENTS.forEach((e,i)=>{
  const r=document.createElement('article');
  r.className='row'+(e.finale?' finale':'');
  r.dataset.i=i;
  let media;
  if(e.img){ media='<div class="rmedia"><img loading="lazy" src="'+e.img+'" alt=""'+(e.crop?' style="aspect-ratio:'+e.crop+'"':'')+'></div>'; }
  else if(e.logo){ media='<div class="rmedia logo"><img loading="lazy" src="'+e.logo+'" alt=""></div>'; }
  else if(e.metric){ media='<div class="rmedia metric"><div class="big">'+e.metric+'</div><div class="lab">'+e.mlab+'</div></div>'; }
  else{ media='<div class="rmedia tile"><div class="badge" style="font-size:'+(e.bfs||24)+'px">'+e.badge+'</div></div>'; }
  const lnk=e.link?'<a class="rlink" href="'+e.link+'" target="_blank" rel="noopener">'+(e.linktext||'See the work →')+'</a>':'';
  const ageHTML=e.age?'<span class="rage">'+e.age+'</span>':'';
  r.innerHTML=media+
    '<div class="rbody">'+ageHTML+'<h3>'+e.title+'</h3>'+
    '<p class="rline">'+e.line+'</p>'+lnk+'</div>';
  rowsWrap.appendChild(r);
});

/* ---- dated rail (years) ---- */
const rail=document.getElementById('rail'),rtag=document.getElementById('rtag');
for(let yr=Y0;yr<=2027;yr++){
  const t=document.createElement('div');t.className='rtick';t.style.left=xp(yr)+'%';rail.appendChild(t);
  const l=document.createElement('div');l.className='ryr';l.style.left=xp(yr)+'%';l.textContent=ageOf(yr);rail.appendChild(l);
}
// rail also carries the Day One? card (it isn't a feed row) — Dec 2026, after graduating
const RAILEV=EVENTS.concat([{y:2026.95,date:"Dec 2026",title:"Day One?"}]);
const dots=[];
RAILEV.forEach((e,i)=>{
  const d=document.createElement('div');d.className='rdot';d.style.left=xp(e.y)+'%';d.title=e.date+' · '+e.title;rail.appendChild(d);dots[i]=d;
});
let activeI=-1;
function setActive(i){
  if(i===activeI)return;activeI=i;
  dots.forEach(d=>d.classList.remove('on'));
  if(i<0)return;
  dots[i].classList.add('on');
  const x=xp(RAILEV[i].y);
  rtag.style.left=x+'%';
  rtag.style.transform = x<13 ? 'translateX(0)' : x>87 ? 'translateX(-100%)' : 'translateX(-50%)';
  rtag.textContent=RAILEV[i].title.replace(/&amp;/g,'&').replace(/<br>/g,' ');
}

/* ---- active row + reveal (scroll-driven) ---- */
document.documentElement.classList.add('anim');
const rowEls=[...document.querySelectorAll('#rows .row')];
const dcard=document.getElementById('dcard');
const feedEl=document.querySelector('.feed');
const endlinks=document.getElementById('endlinks');
dcard.dataset.i=EVENTS.length; // its dot on the rail
const activeEls=[...rowEls,dcard];
function placeCta(){ const vh=window.innerHeight,ch=dcard.offsetHeight; dcard.style.top=Math.max(16,Math.round((vh-ch)/2-vh*0.07))+'px'; } // sits a bit above center to leave room for the links below
function onScroll(){
  const vh=window.innerHeight,mid=vh*0.5;let best=-1,bd=Infinity;
  activeEls.forEach((s)=>{
    const r=s.getBoundingClientRect();
    if(s!==dcard&&r.top<vh*0.92&&r.bottom>vh*0.08)s.classList.add('in');
    const c=r.top+r.height/2,d=Math.abs(c-mid);
    if(r.bottom>0&&r.top<vh&&d<bd){bd=d;best=+s.dataset.i;}
  });
  if(best>=0){setActive(best);}
  else if(rowEls.length){const l=rowEls[rowEls.length-1];if(l.getBoundingClientRect().bottom<=mid)setActive(+l.dataset.i);}
  // the Day One? card flows inline, then sticky-pins at center while the rest of the timeline scrolls on up and
  // off the top. Only right at the bottom do we reveal the buttons/links, grow the card and hide the rail —
  // tied to "within ~5vh of the bottom" so scrolling up even a little takes it all straight back.
  const maxScroll=document.documentElement.scrollHeight-vh;
  // fade the earlier cards out as they travel up toward the top (so they leave with less scroll, without
  // ever looking like they stopped-then-faded) — progressive over the last ~48vh.
  const fade=Math.max(0,Math.min(1,(maxScroll-window.scrollY)/(vh*0.48))).toFixed(3);
  feedEl.style.opacity=fade;
  // the year rail only starts sliding/fading out once the Day One? card has pinned in its spot,
  // and is fully gone by the time the links appear
  const pinScroll=document.getElementById('finale').getBoundingClientRect().top+window.scrollY-parseFloat(dcard.style.top||0);
  const endScroll=maxScroll-vh*0.05;
  const railF=Math.max(0,Math.min(1,(endScroll-window.scrollY)/Math.max(1,endScroll-pinScroll))).toFixed(3);
  rail.style.setProperty('--f',railF);
  rail.classList.toggle('fading',railF<1);
  const stuck = (maxScroll-window.scrollY) <= vh*0.05;
  dcard.classList.toggle('ending', stuck);
  endlinks.classList.toggle('in', stuck);
  rail.classList.toggle('railhide', stuck);
}
placeCta();
window.addEventListener('scroll',onScroll,{passive:true});
window.addEventListener('resize',()=>{placeCta();onScroll();},{passive:true});
onScroll();

/* ---- show/hide rail on hero & cta ---- */
const coverers=new Set();
const railIO=new IntersectionObserver((ents)=>{
  ents.forEach(en=>{ if(en.intersectionRatio>0.5)coverers.add(en.target);else coverers.delete(en.target); });
  rail.classList.toggle('show',coverers.size===0);
},{threshold:[0,0.5,1]});
railIO.observe(document.querySelector('.hero'));
</script>
